<!doctype html>
<meta charset="utf-8">
<title>Your details</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Your details</h1>
  <p id="card"></p>
  <form id="details" novalidate>
    <p><label>Name <input id="name" name="name" autocomplete="name"></label></p>
    <p><label>Email <input id="email" name="email" type="email" autocomplete="email"></label></p>
    <p><label>Phone <input id="phone" name="phone" type="tel" autocomplete="tel"></label></p>
    <p id="unsaved" hidden>You have unsaved changes.</p>
    <button id="save" type="submit">Save</button>
  </form>
  <h2>Messages from us</h2>
  <p><label><input id="newsletter" type="checkbox"> Newsletter by email</label></p>
  <p><label><input id="sms" type="checkbox"> Order updates by text</label></p>
  <p id="message" role="status"></p>
</main>
<script type="module" src="app.js"></script>
