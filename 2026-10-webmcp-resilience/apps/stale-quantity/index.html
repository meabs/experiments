<!doctype html>
<meta charset="utf-8">
<title>Basket</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Basket</h1>
  <p><span id="name"></span>:
    <button id="minus" aria-label="One fewer">−</button>
    <strong id="quantity"></strong>
    <button id="plus" aria-label="One more">+</button>
    <span id="line-total"></span></p>
  <p id="stock"></p>
  <p><label>Postcode <input id="postcode" size="8"></label> <button id="estimate">Delivery time</button>
    <span id="eta"></span></p>
  <p id="message" role="status"></p>
</main>
<script type="module" src="app.js"></script>
