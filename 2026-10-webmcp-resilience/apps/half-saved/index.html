<!doctype html>
<meta charset="utf-8">
<title>Edit listing</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Your listing</h1>
  <p class="tabs"><button id="tab-editor">Edit</button><button id="tab-preview">Preview</button></p>
  <section id="editor">
    <p><label>Title <input id="title" size="40"></label></p>
    <p><label>Description<br><textarea id="description" rows="4" cols="40"></textarea></label></p>
    <p><label>Price £<input id="price" type="number" min="1" step="1" size="6"></label>
      <button id="save-price">Update price</button></p>
    <p id="draft-note"></p>
    <button id="save">Save</button>
  </section>
  <section id="preview" hidden>
    <h2 id="preview-title"></h2>
    <p id="preview-description"></p>
    <p id="preview-price"></p>
    <p id="preview-stats"></p>
  </section>
  <p id="message" role="status"></p>
</main>
<script type="module" src="app.js"></script>
