<!doctype html>
<meta charset="utf-8">
<title>Class booking</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Book a class</h1>
  <ul id="classes"></ul>
  <p><label>Class <select id="class"></select></label></p>
  <p><label>Your name <input id="person" value="Sam"></label></p>
  <button id="book">Book</button>
  <button id="waitlist" hidden>Join the waiting list</button>
  <h2>Your bookings</h2>
  <ul id="mine"></ul>
  <p id="message" role="status"></p>
</main>
<script type="module" src="app.js"></script>
