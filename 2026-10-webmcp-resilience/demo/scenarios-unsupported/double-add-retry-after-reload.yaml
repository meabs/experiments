# Rule (tool description, README: the server keeps the basket on reload): a retry after the page reloads adds once.
name: double-add-retry-after-reload
url: /
allow_navigation: true
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 2050ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: add_to_cart
      args: {sku: "mug-01", requestId: "r1"}
    - at: 2000ms
      retry: add_to_cart
      args: {sku: "mug-01", requestId: "r1"}
  human:
    - at: 400ms
      action: navigate
      value: /
final_invariants:
  - mug == 1
