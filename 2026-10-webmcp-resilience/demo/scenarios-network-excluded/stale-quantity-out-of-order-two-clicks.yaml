# Rule as above. Two clicks on +; the first reply is slow, so the second one comes back first.
name: stale-quantity-out-of-order-two-clicks
url: /
actors:
  human:
    - at: 0ms
      action: click
      selector: '#plus'
    - at: 100ms
      action: click
      selector: '#plus'
  settle:
    - at: 150ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/setQuantity*"
    delays_ms: [400, 50]
final_invariants:
  - line.saved == 3
  - line.shown == line.saved
