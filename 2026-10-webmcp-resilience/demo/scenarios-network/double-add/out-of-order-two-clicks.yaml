# Rule: separate adds all count. Two clicks; the first reply is slow, so the second one comes back first.
name: double-add-out-of-order-two-clicks
url: /
# Clicks start at 300 ms, once the product list has loaded.
actors:
  human:
    - at: 300ms
      action: click
      selector: '#add-mug'
    - at: 400ms
      action: click
      selector: '#add-mug'
  settle:
    - at: 450ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/addItem*"
    delays_ms: [400, 50]
final_invariants:
  - mug == 2
