# Rule: every add puts the product in the basket once, also when the shop is slow. The server takes 1.2 s to answer.
name: double-add-slow-server-click
url: /
# Clicks start at 300 ms, once the product list has loaded.
actors:
  human:
    - at: 300ms
      action: click
      selector: '#add-mug'
  settle:
    - at: 400ms
      action: wait
      value: "3000"
faults:
  - type: http_latency
    url: "**/__server/addItem*"
    duration_ms: 1200
final_invariants:
  - mug == 1
