# Rule as above. The first of the two writes (the customer's save, then the assistant's change) answers last.
name: lost-update-out-of-order
url: /
actors:
  human:
    - at: 300ms
      action: fill
      selector: '#name'
      value: Sam Smith
    - at: 400ms
      action: click
      selector: '#save'
  agent:
    - at: 500ms
      invoke: update_profile
      args: {field: "email", value: "sam.new@example.com"}
  settle:
    - at: 550ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/{saveProfile,updateFields}*"
    delays_ms: [400, 50]
final_invariants:
  - profile.email == "sam.new@example.com"
  - profile.name == "Sam Smith"
