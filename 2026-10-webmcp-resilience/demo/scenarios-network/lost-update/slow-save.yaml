# Rule: the assistant's change to one field survives the customer saving the form, and the customer's edit survives
# too. The customer's save is slow.
name: lost-update-slow-save
url: /
actors:
  human:
    - at: 300ms
      action: fill
      selector: '#name'
      value: Sam Smith
    - at: 450ms
      action: click
      selector: '#save'
  agent:
    - at: 500ms
      invoke: update_profile
      args: {field: "email", value: "sam.new@example.com"}
  settle:
    - at: 550ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/saveProfile*"
    duration_ms: 400
final_invariants:
  - profile.email == "sam.new@example.com"
  - profile.name == "Sam Smith"
