# Rule: after overlapping changes, the saved quantity is the last one asked for, and the page shows what is saved.
# Two assistant changes; the first reply is slow, so the second one comes back first.
name: stale-quantity-out-of-order-two-assistant-changes
url: /
actors:
  agent:
    - at: 0ms
      invoke: set_quantity
      args: {sku: "tea-02", quantity: 5}
  agent_again:
    - at: 100ms
      invoke: set_quantity
      args: {sku: "tea-02", quantity: 7}
  settle:
    - at: 150ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/setQuantity*"
    delays_ms: [400, 50]
final_invariants:
  - line.saved == 7
  - line.shown == line.saved
