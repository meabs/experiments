# Rule: every payment taken (and not refunded) has an order, and every order has a payment, even if place_order is
# cancelled. The server is slow at the createOrder step, and the call is cancelled during it.
name: charge-no-order-slow-createOrder-cancelled
url: /
actors:
  agent:
    - at: 0ms
      invoke: place_order
      args: {}
  assistant_gives_up:
    - at: 500ms
      cancel: place_order
  settle:
    - at: 550ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/createOrder*"
    duration_ms: 400
confirmations:
  - tool: place_order
    description: The customer asked the assistant to place the order.
final_invariants:
  - pay.charges == pay.orders
