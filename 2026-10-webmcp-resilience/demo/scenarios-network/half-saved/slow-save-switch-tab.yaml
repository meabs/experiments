# Rule (README): a save that has started always finishes, even if the seller switches tab while it is running. The
# server is slow to save the description.
name: half-saved-slow-save-switch-tab
url: /
actors:
  agent:
    - at: 0ms
      invoke: save_listing
      args: {title: "Walnut bookshelf", description: "Solid walnut, 180 cm tall, five shelves."}
  human:
    - at: 200ms
      action: click
      selector: '#tab-preview'
  settle:
    - at: 250ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/updateDescription*"
    duration_ms: 400
final_invariants:
  - listing.title == "Walnut bookshelf"
  - listing.description == "Solid walnut, 180 cm tall, five shelves."
