# Rule: a class never has more bookings than seats. The last seat, booked by both at once, on a slow server.
name: last-seat-slow-server-person-and-assistant
url: /
actors:
  agent:
    - at: 0ms
      invoke: book_seat
      args: {name: "Ana"}
  human:
    - at: 0ms
      action: click
      selector: '#book'
  settle:
    - at: 50ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/createBooking*"
    duration_ms: 300
final_invariants:
  - spin.over <= 0
