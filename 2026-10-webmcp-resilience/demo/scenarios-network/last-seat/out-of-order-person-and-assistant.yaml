# Rule as above. The first booking's reply is slow, so the second one comes back first.
name: last-seat-out-of-order-person-and-assistant
url: /
actors:
  agent:
    - at: 0ms
      invoke: book_seat
      args: {name: "Ana"}
  human:
    - at: 60ms
      action: click
      selector: '#book'
  settle:
    - at: 110ms
      action: wait
      value: "2000"
faults:
  - type: http_latency
    url: "**/__server/{getClass,createBooking}*"
    delays_ms: [400, 50]
final_invariants:
  - spin.over <= 0
