# Rule as above. The customer saves while the assistant's change (delayed a little) is still running.
name: lost-update-save-during-assistant
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 500ms
      action: wait
      value: "1500"
  human:
    - at: 300ms
      action: fill
      selector: '#name'
      value: Sam Smith
    - at: 450ms
      action: click
      selector: '#save'
  agent:
    - at: 400ms
      invoke: update_profile
      args: {field: "email", value: "sam.new@example.com"}
faults:
  - type: latency
    tool: update_profile
    duration_ms: 100
    at: before_invoke
final_invariants:
  - profile.email == "sam.new@example.com"
  - profile.name == "Sam Smith"
