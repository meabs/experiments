# Rule: a change the assistant makes to one field survives the customer saving the form, and the customer's own edit
# survives too. The customer edits the name; the assistant changes the email; then the customer saves.
name: lost-update-edit-assistant-save
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 950ms
      action: wait
      value: "1500"
  human:
    - at: 300ms
      action: fill
      selector: '#name'
      value: Sam Smith
    - at: 900ms
      action: click
      selector: '#save'
  agent:
    - at: 400ms
      invoke: update_profile
      args: {field: "email", value: "sam.new@example.com"}
final_invariants:
  - profile.email == "sam.new@example.com"
  - profile.name == "Sam Smith"
