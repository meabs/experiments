# Rule as above, with the tool's own cancellation fault (cancels the call just after it starts).
name: charge-no-order-cancellation-fault
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 50ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: place_order
      args: {}
faults:
  - type: cancellation
    tool: place_order
    at: before_invoke
confirmations:
  - tool: place_order
    description: The customer asked the assistant to place the order.
final_invariants:
  - pay.charges == pay.orders
