# Rule: every payment taken (and not refunded) has an order, and every order has a payment, even if place_order is
# cancelled. Cancelled 300 ms into the call (the page prices, pays, then creates the order).
name: charge-no-order-cancel-at-300ms
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 350ms
      action: wait
      value: "1500"
  assistant_gives_up:
    - at: 300ms
      cancel: place_order
  agent:
    - at: 0ms
      invoke: place_order
      args: {}
confirmations:
  - tool: place_order
    description: The customer asked the assistant to place the order.
final_invariants:
  - pay.charges == pay.orders
