# Rule: after overlapping changes, the page shows what is saved. (An earlier version also required saved == 5, which
# assumed the click lands before the assistant's change; the tool does not guarantee that order, so it was dropped.)
name: stale-quantity-click-then-assistant
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 100ms
      action: wait
      value: "1500"
  human:
    - at: 0ms
      action: click
      selector: '#plus'
  agent:
    - at: 50ms
      invoke: set_quantity
      args: {sku: "tea-02", quantity: 5}
final_invariants:
  - line.shown == line.saved
