# Rule as above. The assistant's change is delayed, and the customer clicks + while it is running.
name: stale-quantity-assistant-then-click
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 100ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: set_quantity
      args: {sku: "tea-02", quantity: 5}
  human:
    - at: 50ms
      action: click
      selector: '#plus'
faults:
  - type: latency
    tool: set_quantity
    duration_ms: 100
    at: after_invoke
final_invariants:
  - line.shown == line.saved
