# Rule (README): a class never has more bookings than seats. The assistant's booking call repeated (a retry).
name: last-seat-assistant-twice
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 50ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: book_seat
      args: {name: "Ana"}
faults:
  - type: duplicate_invocation
    tool: book_seat
    at: before_invoke
final_invariants:
  - spin.over <= 0
