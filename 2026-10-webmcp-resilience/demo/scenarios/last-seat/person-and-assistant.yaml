# Rule (README): a class never has more bookings than seats. The last seat, booked by the assistant and by the person
# on the page at the same moment, with the assistant's call delayed a little.
name: last-seat-person-and-assistant
url: /
allow_reordering: true
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 50ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: book_seat
      args: {name: "Ana"}
  human:
    - at: 0ms
      action: click
      selector: '#book'
faults:
  - type: latency
    tool: book_seat
    duration_ms: 60
    at: before_invoke
final_invariants:
  - spin.over <= 0
