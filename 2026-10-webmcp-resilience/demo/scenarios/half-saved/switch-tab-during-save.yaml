# Rule (README): a save that has started always finishes, even if the seller switches tab while it is running.
name: half-saved-switch-tab-during-save
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 110ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: save_listing
      args: {title: "Walnut bookshelf", description: "Solid walnut, 180 cm tall, five shelves."}
  human:
    - at: 60ms
      action: click
      selector: '#tab-preview'
final_invariants:
  - listing.title == "Walnut bookshelf"
  - listing.description == "Solid walnut, 180 cm tall, five shelves."
