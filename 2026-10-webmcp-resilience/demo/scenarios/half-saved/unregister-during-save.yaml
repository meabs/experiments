# Rule (README): a started save always finishes. The tool is unregistered while its call is running (what leaving
# the tab does), using the page's testing hook.
name: half-saved-unregister-during-save
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 50ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: save_listing
      args: {title: "Walnut bookshelf", description: "Solid walnut, 180 cm tall, five shelves."}
faults:
  - type: unregister_during_invoke
    tool: save_listing
    at: before_invoke
final_invariants:
  - listing.title == "Walnut bookshelf"
  - listing.description == "Solid walnut, 180 cm tall, five shelves."
