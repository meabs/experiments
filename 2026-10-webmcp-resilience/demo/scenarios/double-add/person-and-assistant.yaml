# Rule: separate adds all count. A click and an assistant add at the same moment make two.
name: double-add-person-and-assistant
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 50ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: add_to_cart
      args: {sku: "mug-01", requestId: "r9"}
  human:
    - at: 0ms
      action: click
      selector: '#add-mug'
final_invariants:
  - mug == 2
