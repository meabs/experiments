# Rule (tool description): if a call times out, the assistant calls again with the same requestId; add once.
# The assistant gives up on the first call after 60 ms (cancels it), then retries.
name: double-add-retry-after-timeout
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 350ms
      action: wait
      value: "1500"
  assistant_gives_up:
    - at: 60ms
      cancel: add_to_cart
  agent:
    - at: 0ms
      invoke: add_to_cart
      args: {sku: "mug-01", requestId: "r1"}
    - at: 300ms
      retry: add_to_cart
      args: {sku: "mug-01", requestId: "r1"}
final_invariants:
  - mug == 1
