# Rule (tool description): a repeated add_to_cart with the same requestId adds the product once.
name: double-add-repeated-call
url: /
actors:
  settle:  # wait after the last action so in-page work finishes before the final check
    - at: 50ms
      action: wait
      value: "1500"
  agent:
    - at: 0ms
      invoke: add_to_cart
      args: {sku: "mug-01", requestId: "r1"}
faults:
  - type: duplicate_invocation
    tool: add_to_cart
    at: before_invoke
final_invariants:
  - mug == 1
