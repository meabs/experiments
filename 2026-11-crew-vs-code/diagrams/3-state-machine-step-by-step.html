<link rel="stylesheet" href="style.css">
<svg width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
  </defs>
  <text x="40" y="62" class="th">The state machine, step by step</text>
  <text x="40" y="104" class="ts">The model reads the email and writes the reply. Everything in between is ordinary code, the same every time.</text>

  <!-- the email -->
  <rect x="40" y="140" width="1720" height="90" rx="16" class="box"/>
  <text x="70" y="180" class="t">Email: "Change the address on A1088 to 14 Elm Road. One mug in A1042 arrived chipped,</text>
  <text x="70" y="216" class="t">please replace the set. Do you take Amex?"</text>
  <path d="M900 230 V 268" class="ln"/>

  <!-- step 1 -->
  <text x="40" y="300" class="tb">Step 1. The model fills in a form</text>
  <text x="680" y="300" class="ts">one form line per request; each line must be one of nine fixed request types</text>
  <rect x="40" y="320" width="560" height="120" rx="14" class="boxt"/>
  <text x="70" y="368" class="mono">type: change_address</text>
  <text x="70" y="408" class="mono">order: A1088 · to: 14 Elm Road</text>
  <rect x="620" y="320" width="560" height="120" rx="14" class="boxt"/>
  <text x="650" y="368" class="mono">type: damaged_item</text>
  <text x="650" y="408" class="mono">order: A1042 · wants: replacement</text>
  <rect x="1200" y="320" width="560" height="120" rx="14" class="boxt"/>
  <text x="1230" y="368" class="mono">type: policy_question</text>
  <text x="1230" y="408" class="mono">"Do you take Amex?"</text>
  <path d="M320 440 V 488" class="ln"/><path d="M900 440 V 488" class="ln"/><path d="M1480 440 V 488" class="ln"/>

  <!-- step 2 -->
  <text x="40" y="520" class="tb">Step 2. Plain code handles each line with if/else rules</text>
  <text x="900" y="520" class="ts">no model involved: these are the shop's rules, written as code</text>
  <rect x="40" y="540" width="560" height="250" rx="14" class="box"/>
  <text x="70" y="588" class="t">Already dispatched?</text>
  <text x="90" y="630" class="ts">yes: decline, and say why</text>
  <text x="90" y="666" class="ts">no: call change_address</text>
  <text x="70" y="730" class="t">Fact: address changed</text>
  <rect x="620" y="540" width="560" height="250" rx="14" class="box"/>
  <text x="650" y="588" class="t">Delivered, within 30 days?</text>
  <text x="670" y="630" class="ts">no: decline, and say why</text>
  <text x="670" y="666" class="ts">yes: send a replacement</text>
  <text x="670" y="702" class="ts">(or refund, if they asked for one)</text>
  <text x="650" y="760" class="t">Fact: replacement sent</text>
  <rect x="1200" y="540" width="560" height="250" rx="14" class="box"/>
  <text x="1230" y="588" class="t">A general question</text>
  <text x="1250" y="630" class="ts">no tool needed: the answer</text>
  <text x="1250" y="666" class="ts">is in the shop's policy</text>
  <text x="1230" y="730" class="t">Fact: answer from the policy</text>

  <rect x="40" y="815" width="1720" height="70" rx="14" class="boxr"/>
  <text x="900" y="860" class="t" text-anchor="middle">Anything the form can't express, a billing problem, or a tool that fails: hand it to a person</text>
  <path d="M900 885 V 928" class="ln"/>

  <!-- step 3 -->
  <text x="40" y="960" class="tb">Step 3. The model writes the reply from the list of facts</text>
  <rect x="40" y="980" width="1720" height="110" rx="16" class="boxt"/>
  <text x="900" y="1030" class="t" text-anchor="middle">It is told not to promise or decide anything that isn't in the facts</text>
  <text x="900" y="1068" class="ts" text-anchor="middle">Replies claiming an action that wasn't taken, in the main run: 0%</text>

  <text x="40" y="1140" class="ts">Teal: the model. Beige: code I wrote. Two model calls per email, whatever it asks. Source: 2026-11-crew-vs-code/src/statemachine.py.</text>
</svg>
