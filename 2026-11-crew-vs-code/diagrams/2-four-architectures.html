<link rel="stylesheet" href="style.css">
<svg width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
  </defs>
  <text x="40" y="62" class="th">Four ways to build the same support bot</text>
  <text x="40" y="104" class="ts">Beige: code I wrote decides. Teal: a model decides. All four use the same shop, the same policy text and the same model.</text>

  <text x="40"  y="170" class="tb">1. State machine</text>
  <text x="40"  y="204" class="ts">always 2 model calls</text>
  <text x="480" y="170" class="tb">2. Single agent</text>
  <text x="480" y="204" class="ts">up to 20 calls</text>
  <text x="920" y="170" class="tb">3. Crew, full history</text>
  <text x="920" y="204" class="ts">up to 20 calls in total</text>
  <text x="1360" y="170" class="tb">4. Crew, note only</text>
  <text x="1360" y="204" class="ts">up to 20 calls in total</text>

  <!-- 1 state machine -->
  <rect x="40" y="240" width="380" height="120" rx="16" class="boxt"/>
  <text x="230" y="290" class="t" text-anchor="middle">Model fills a typed list</text>
  <text x="230" y="328" class="ts" text-anchor="middle">each request: intent + fields</text>
  <path d="M230 360 V 408" class="ln"/>
  <rect x="40" y="410" width="380" height="140" rx="16" class="box"/>
  <text x="230" y="460" class="t" text-anchor="middle">Plain if/else code</text>
  <text x="230" y="498" class="ts" text-anchor="middle">applies the policy to each</text>
  <text x="230" y="530" class="ts" text-anchor="middle">anything else: a person</text>
  <path d="M230 550 V 598" class="ln"/>
  <rect x="40" y="600" width="380" height="120" rx="16" class="boxt"/>
  <text x="230" y="650" class="t" text-anchor="middle">Model writes the reply</text>
  <text x="230" y="688" class="ts" text-anchor="middle">from the facts code found</text>

  <!-- 2 single agent -->
  <rect x="480" y="240" width="380" height="480" rx="16" class="boxt"/>
  <text x="670" y="300" class="t" text-anchor="middle">Model in a loop</text>
  <text x="670" y="350" class="ts" text-anchor="middle">all nine tools</text>
  <text x="670" y="384" class="ts" text-anchor="middle">the whole policy</text>
  <text x="670" y="450" class="ts" text-anchor="middle">picks a tool</text>
  <text x="670" y="484" class="ts" text-anchor="middle">reads the result</text>
  <text x="670" y="518" class="ts" text-anchor="middle">picks the next one</text>
  <text x="670" y="552" class="ts" text-anchor="middle">…</text>
  <text x="670" y="590" class="ts" text-anchor="middle">writes the reply</text>
  <path d="M800 460 C 850 500, 850 560, 800 590" class="lnt"/>

  <!-- 3 crew, full history -->
  <rect x="920" y="240" width="380" height="120" rx="16" class="boxt"/>
  <text x="1110" y="290" class="t" text-anchor="middle">Front desk</text>
  <text x="1110" y="328" class="ts" text-anchor="middle">looks up; can't change anything</text>
  <path d="M1040 360 L 1000 448" class="ln"/>
  <path d="M1180 360 L 1220 448" class="ln"/>
  <text x="1110" y="410" class="ts" text-anchor="middle">transfer</text>
  <rect x="920" y="450" width="180" height="160" rx="16" class="boxt"/>
  <text x="1010" y="500" class="t" text-anchor="middle">Delivery</text>
  <text x="1010" y="538" class="ts" text-anchor="middle">tracking,</text>
  <text x="1010" y="568" class="ts" text-anchor="middle">address,</text>
  <text x="1010" y="594" class="ts" text-anchor="middle">cancel</text>
  <rect x="1120" y="450" width="180" height="160" rx="16" class="boxt"/>
  <text x="1210" y="500" class="t" text-anchor="middle">Returns</text>
  <text x="1210" y="538" class="ts" text-anchor="middle">refunds,</text>
  <text x="1210" y="568" class="ts" text-anchor="middle">replacements</text>
  <rect x="920" y="635" width="380" height="90" rx="16" class="box"/>
  <text x="1110" y="668" class="t" text-anchor="middle">Next agent sees</text>
  <text x="1110" y="702" class="ts" text-anchor="middle">the whole conversation</text>

  <!-- 4 crew, note only -->
  <rect x="1360" y="240" width="400" height="120" rx="16" class="boxt"/>
  <text x="1560" y="290" class="t" text-anchor="middle">Front desk</text>
  <text x="1560" y="328" class="ts" text-anchor="middle">looks up; can't change anything</text>
  <path d="M1490 360 L 1450 448" class="ln"/>
  <path d="M1630 360 L 1670 448" class="ln"/>
  <text x="1560" y="410" class="ts" text-anchor="middle">transfer</text>
  <rect x="1360" y="450" width="190" height="160" rx="16" class="boxt"/>
  <text x="1455" y="500" class="t" text-anchor="middle">Delivery</text>
  <text x="1455" y="538" class="ts" text-anchor="middle">tracking,</text>
  <text x="1455" y="568" class="ts" text-anchor="middle">address,</text>
  <text x="1455" y="594" class="ts" text-anchor="middle">cancel</text>
  <rect x="1570" y="450" width="190" height="160" rx="16" class="boxt"/>
  <text x="1665" y="500" class="t" text-anchor="middle">Returns</text>
  <text x="1665" y="538" class="ts" text-anchor="middle">refunds,</text>
  <text x="1665" y="568" class="ts" text-anchor="middle">replacements</text>
  <rect x="1360" y="635" width="400" height="90" rx="16" class="box"/>
  <text x="1560" y="668" class="t" text-anchor="middle">Next agent sees</text>
  <text x="1560" y="702" class="ts" text-anchor="middle">only the email and a note</text>

  <text x="1340" y="762" class="ts" text-anchor="middle">Both crews: each agent has its own tools and policy sections</text>

  <rect x="40" y="800" width="1720" height="200" rx="18" class="boxn"/>
  <text x="900" y="860" class="tw" text-anchor="middle">The shop's nine tools (simulated, with failures injected in some cases)</text>
  <text x="900" y="912" fill="#e8eaed" font-size="25" text-anchor="middle">find_customer · get_order · track_shipment · check_stock · issue_refund · send_replacement</text>
  <text x="900" y="952" fill="#e8eaed" font-size="25" text-anchor="middle">change_address · cancel_order · escalate (hand to a person)</text>
</svg>
