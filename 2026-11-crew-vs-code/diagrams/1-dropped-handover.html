<link rel="stylesheet" href="style.css">
<svg width="1800" height="960" viewBox="0 0 1800 960">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4532a"/></marker>
  </defs>
  <text x="40" y="62" class="th">The hand-over that never happened</text>
  <text x="40" y="104" class="ts">Case L6-01: "Change the address on A1088 to 14 Elm Road. One mug in A1042 arrived chipped, please replace the set. Do you take Amex?"</text>

  <!-- the crew -->
  <rect x="40" y="160" width="400" height="190" rx="16" class="box"/>
  <text x="240" y="220" class="tb" text-anchor="middle">Front desk</text>
  <text x="240" y="265" class="ts" text-anchor="middle">looks things up,</text>
  <text x="240" y="297" class="ts" text-anchor="middle">can't change anything</text>
  <path d="M440 255 H 560" class="lnt"/>
  <text x="500" y="235" class="ts" text-anchor="middle">transfer</text>

  <rect x="565" y="160" width="520" height="190" rx="16" class="boxt"/>
  <text x="825" y="220" class="tb" text-anchor="middle">Returns specialist</text>
  <text x="825" y="265" class="ts" text-anchor="middle">sends the replacement set ✓</text>
  <text x="825" y="297" class="ts" text-anchor="middle">then writes the reply instead of transferring</text>

  <path d="M1085 255 H 1205" class="lnr"/>
  <rect x="1210" y="160" width="550" height="190" rx="16" class="boxr"/>
  <text x="1485" y="220" class="tb" text-anchor="middle">Delivery specialist</text>
  <text x="1485" y="265" class="ts" text-anchor="middle">never called;</text>
  <text x="1485" y="297" class="ts" text-anchor="middle">address never changed</text>

  <!-- the reply -->
  <rect x="40" y="400" width="1720" height="130" rx="16" class="boxn"/>
  <text x="80" y="455" class="tw">Reply: "I’ve passed your address change request for A1088 to our delivery team.</text>
  <text x="80" y="500" class="tw">A colleague will be in touch within 1 working day."   Nobody was told.</text>

  <!-- results -->
  <rect x="40" y="580" width="400" height="300" rx="18" class="box"/>
  <text x="240" y="640" class="tb" text-anchor="middle">State machine</text>
  <text x="240" y="740" class="th" text-anchor="middle">20 of 20</text>
  <text x="240" y="790" class="ts" text-anchor="middle">address changed</text>
  <rect x="480" y="580" width="400" height="300" rx="18" class="box"/>
  <text x="680" y="640" class="tb" text-anchor="middle">Single agent</text>
  <text x="680" y="740" class="th" text-anchor="middle">20 of 20</text>
  <text x="680" y="790" class="ts" text-anchor="middle">address changed</text>
  <rect x="920" y="580" width="400" height="300" rx="18" class="boxt"/>
  <text x="1120" y="640" class="tb" text-anchor="middle">Crew, note only</text>
  <text x="1120" y="740" class="th" text-anchor="middle">20 of 20</text>
  <text x="1120" y="790" class="ts" text-anchor="middle">address changed</text>
  <rect x="1360" y="580" width="400" height="300" rx="18" class="boxr"/>
  <text x="1560" y="640" class="tb" text-anchor="middle">Crew, full history</text>
  <text x="1560" y="740" class="th red" text-anchor="middle">7 of 20</text>
  <text x="1560" y="790" class="ts" text-anchor="middle">address changed</text>
  <text x="40" y="935" class="ts">gpt-6-luna, 20 runs each (2 wordings × 2 account sizes × 5 repeats).</text>
</svg>
