<link rel="stylesheet" href="style.css">
<svg width="1800" height="1120" viewBox="0 0 1800 1120">
  <text x="40" y="62" class="th">Three ways to check a screenshot, on one planted bug</text>
  <text x="40" y="102" class="ts">The cart lines add up to US$199.50. The total says US$219.50. Every unit test still passes.</text>

  <rect x="40" y="140" width="640" height="616" rx="12" fill="#fff" stroke="#b9b2a0" stroke-width="3"/>
  <image href="cart-wrong-total.png" x="50" y="150" width="620" height="558"/>
  <rect x="470" y="588" width="200" height="36" rx="8" fill="none" stroke="#b4532a" stroke-width="5"/>
  <text x="60" y="742" class="ts">The planted bug: the total doesn't add up</text>

  <rect x="730" y="140" width="1030" height="170" rx="14" class="box"/>
  <text x="760" y="190" class="tb">1. Pixel diff</text>
  <text x="760" y="232" class="t">Flag if more than 0.5% of pixels changed from the clean screen.</text>
  <text x="760" y="280" class="t">Here: 0.02% changed. <tspan class="red" font-weight="650">Not flagged.</tspan></text>

  <rect x="730" y="335" width="1030" height="170" rx="14" class="box"/>
  <text x="760" y="385" class="tb">2. One open question</text>
  <text x="760" y="427" class="t">"Does this screenshot show a defect a customer would notice?"</text>
  <text x="760" y="475" class="t">Here: yes. <tspan class="red" font-weight="650">But also yes to 22 of 24 harmless changes.</tspan></text>

  <rect x="730" y="530" width="1030" height="400" rx="14" class="boxt"/>
  <text x="760" y="580" class="tb">3. Written yes/no assertions for this screen</text>
  <text x="760" y="625" class="ts">Written before any bug was designed. Eight in all, including:</text>
  <text x="760" y="672" class="q">• Does each cart line show the product name, unit price, quantity and subtotal?</text>
  <text x="760" y="710" class="q">• For every cart line, is the subtotal equal to the unit price times the quantity?</text>
  <text x="760" y="748" class="q" font-weight="650">• Is a cart total shown, and is it equal to the sum of the line subtotals?</text>
  <text x="760" y="800" class="t">Gemini, gpt-6.1-terra: <tspan class="green" font-weight="650">no. Caught.</tspan></text>
  <text x="760" y="845" class="t">Jev: <tspan class="red" font-weight="650">yes (0.93). Missed.</tspan></text>
  <text x="760" y="895" class="ts">Flag the screen if any answer comes back the wrong way.</text>

  <text x="40" y="1000" class="tb">Each checker saw 54 screenshots three times:</text>
  <text x="40" y="1045" class="t">22 with a planted defect, 24 with a harmless change (new colour, font, picture…), 8 untouched.</text>
  <text x="1760" y="1095" class="tsm" text-anchor="end">Source: github.com/meabs/experiments, 2026-11-visual-checks</text>
</svg>
