<link rel="stylesheet" href="style.css">
<svg width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker></defs>
  <text x="40" y="62" class="th">How the experiment worked</text>
  <text x="40" y="102" class="ts">Codex CLI with gpt-5.6-luna, a small Spring Boot banking API, six tickets, 3 runs per ticket and arm.</text>

  <rect x="40" y="150" width="520" height="400" rx="16" class="box"/>
  <text x="70" y="200" class="tb">Six tickets</text>
  <text x="70" y="250" class="t"><tspan font-weight="650">Clear</tspan> (2): nothing left out</text>
  <text x="70" y="300" class="t"><tspan font-weight="650">Some</tspan> (2): 2 requirements left out</text>
  <text x="70" y="350" class="t"><tspan font-weight="650">Lots</tspan> (2): 4 requirements left out</text>
  <text x="70" y="410" class="ts">Each left-out requirement is either</text>
  <text x="70" y="445" class="ts">• <tspan class="teal" font-weight="650">in the repo</tspan>: findable in code or README</text>
  <text x="70" y="480" class="ts">• <tspan class="red" font-weight="650">in my head</tspan>: only the developer knows it,</text>
  <text x="70" y="512" class="ts">  e.g. "support may only add internal notes"</text>

  <rect x="40" y="590" width="520" height="360" rx="16" class="boxr"/>
  <text x="70" y="640" class="tb">The developer: me (Claude)</text>
  <text x="70" y="688" class="ts">A private brief per ticket, written before</text>
  <text x="70" y="720" class="ts">any run. Fixed rules: answer only what is</text>
  <text x="70" y="752" class="ts">asked; "yes" if it matches the brief; correct</text>
  <text x="70" y="784" class="ts">it if not; "your call" if the brief doesn't care.</text>
  <text x="70" y="840" class="ts">A judge model checked all 54 interviews</text>
  <text x="70" y="872" class="ts">for anything given away unasked:</text>
  <text x="70" y="904" class="ts"><tspan font-weight="650">no leaks found.</tspan></text>

  <path d="M560 350 H 625" class="ln"/>
  <rect x="630" y="150" width="1130" height="560" rx="18" class="boxt"/>
  <text x="660" y="200" class="tb">Five ways to start the agent (stage 1, 90 runs)</text>
  <g class="t">
    <text x="660" y="260" font-weight="650">T</text><text x="740" y="260">The ticket only. Nobody to ask.</text>
    <text x="660" y="320" font-weight="650">Q</text><text x="740" y="320">Ticket + "Before you start, ask me anything you need to know."</text>
    <text x="660" y="380" font-weight="650">G</text><text x="740" y="380">Ticket + "Grill me on this before you build it."  (grilling skill)</text>
    <text x="660" y="440" font-weight="650">GD</text><text x="740" y="440">Ticket + "Use grill-with-docs on this …"  (+ glossary and ADRs)</text>
    <text x="660" y="500" font-weight="650">GY</text><text x="740" y="500">As G, but a script answers "Yes." to everything</text>
  </g>
  <text x="660" y="580" class="ts">Q, G and GD: I answered as the developer. Scored by hidden tests:</text>
  <text x="660" y="616" class="ts">left-out requirements met, counted only when the ticket's own tests pass.</text>
  <text x="660" y="668" class="tsm">Run IDs were anonymised, though agents often named the skill they used.</text>

  <path d="M1195 710 V 765" class="ln"/>
  <rect x="630" y="770" width="1130" height="180" rx="18" class="boxn"/>
  <text x="660" y="820" class="tw">Stage 2: the next ticket, fresh session, nobody to ask (24 runs)</text>
  <text x="660" y="865" fill="#e3eff3" font-size="24">12 runs get the GLOSSARY.md and ADRs one grill-with-docs run wrote; 12 get nothing.</text>
  <text x="660" y="900" fill="#e3eff3" font-size="24">Each follow-up needs one rule the first interview settled.</text>
</svg>
