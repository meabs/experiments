<link rel="stylesheet" href="style.css">
<svg width="1800" height="1060" viewBox="0 0 1800 1060">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
  </defs>
  <text x="40" y="62" class="th">How the grilling skill works</text>
  <text x="40" y="102" class="ts">The agent interviews you before it writes any code. Example from a real run (ticket L1: freeze and unfreeze accounts).</text>

  <rect x="40" y="150" width="300" height="170" rx="16" class="box"/>
  <text x="190" y="205" class="tb" text-anchor="middle">1. The ticket</text>
  <text x="190" y="250" class="ts" text-anchor="middle">plus "Grill me on this</text>
  <text x="190" y="282" class="ts" text-anchor="middle">before you build it."</text>
  <path d="M340 235 H 405" class="ln"/>

  <rect x="410" y="150" width="380" height="170" rx="16" class="box"/>
  <text x="600" y="205" class="tb" text-anchor="middle">2. Map the decisions</text>
  <text x="600" y="250" class="ts" text-anchor="middle">a "design tree"; facts in</text>
  <text x="600" y="282" class="ts" text-anchor="middle">the code it looks up itself</text>
  <path d="M790 235 H 855" class="ln"/>

  <rect x="860" y="135" width="900" height="420" rx="18" class="boxt"/>
  <text x="890" y="185" class="tb">3. Numbered questions, each with a recommended answer</text>
  <rect x="890" y="210" width="840" height="150" rx="12" fill="#fff" stroke="#b9b2a0" stroke-width="2"/>
  <text x="910" y="250" class="q">❓ Q1 — Who may freeze/unfreeze? … Should both endpoints be available</text>
  <text x="910" y="282" class="q">to any support user assigned to that account plus tenant admins?</text>
  <text x="910" y="330" class="q teal">➡️ Recommendation: allow assigned SUPPORT and tenant ADMIN staff …</text>
  <text x="890" y="408" class="t" font-weight="650">The developer replies to each one:</text>
  <text x="910" y="448" class="q"><tspan class="green" font-weight="650">"Yes."</tspan>  accepts the recommendation (most answers)</text>
  <text x="910" y="484" class="q"><tspan class="red" font-weight="650">"Not quite. … only admins can unfreeze."</tspan>  corrects a wrong one</text>
  <text x="910" y="520" class="q"><tspan font-weight="650">"Your call."</tspan>  for things the developer doesn't mind</text>

  <path d="M1310 555 V 640" class="lnt"/>
  <text x="1330" y="605" class="tsm">answers open the next branch</text>

  <rect x="860" y="645" width="900" height="130" rx="16" class="box"/>
  <text x="890" y="695" class="tb">4. Next round … until the tree is settled</text>
  <text x="890" y="740" class="ts">usually 2–3 rounds and 8–11 questions per ticket in this experiment</text>
  <path d="M1310 775 V 830" class="ln"/>

  <rect x="860" y="835" width="900" height="180" rx="18" class="boxn"/>
  <text x="890" y="885" class="tw">5. Summary → "Yes, go ahead" → it builds</text>
  <text x="890" y="930" fill="#e3eff3" font-size="24">grill-with-docs also writes what was settled into the repo:</text>
  <text x="890" y="966" fill="#e3eff3" font-size="24">GLOSSARY.md (domain terms) and docs/adr/0001-….md (decision records)</text>

  <rect x="40" y="400" width="740" height="615" rx="18" class="box"/>
  <text x="70" y="455" class="tb">Where the value came from</text>
  <text x="70" y="505" class="t">The agent's recommendations were mostly right.</text>
  <text x="70" y="545" class="t">Most replies were just "Yes."</text>
  <text x="70" y="610" class="t">But on tickets that left out business rules,</text>
  <text x="70" y="650" class="t"><tspan class="red" font-weight="650">1–2 recommendations per ticket were wrong</tspan>,</text>
  <text x="70" y="690" class="t">and they were exactly the rules only the</text>
  <text x="70" y="730" class="t">developer knew.</text>
  <text x="70" y="795" class="t">Correcting them was the whole gain.</text>
  <text x="70" y="835" class="t">A developer who said "yes" to everything</text>
  <text x="70" y="875" class="t">got the same result as no interview at all.</text>
  <text x="70" y="960" class="tsm">Skill: github.com/mattpocock/skills (grilling, grill-with-docs), MIT.</text>
</svg>
