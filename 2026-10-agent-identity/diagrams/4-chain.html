<link rel="stylesheet" href="style.css">
<style>.halo { paint-order: stroke; stroke: #fff; stroke-width: 9px; stroke-linejoin: round; }</style>
<svg width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
  </defs>
  <text x="40" y="62" class="th">Handing work to a sub-agent: what Keycloak 26.8.1 allowed</text>

  <rect x="40" y="110" width="250" height="90" rx="14" class="box"/><text x="165" y="166" class="tb" text-anchor="middle">Bob</text>
  <rect x="400" y="110" width="330" height="90" rx="14" class="boxn"/><text x="565" y="166" class="tw" text-anchor="middle">Assistant</text>
  <rect x="840" y="110" width="400" height="90" rx="14" class="boxn"/><text x="1040" y="166" class="tw" text-anchor="middle">Expenses sub-agent</text>
  <rect x="1350" y="110" width="410" height="90" rx="14" class="box"/><text x="1555" y="166" class="tb" text-anchor="middle">Expenses service</text>
  <path d="M290 155 L392 155" class="ln"/><path d="M730 155 L832 155" class="ln"/><path d="M1240 155 L1342 155" class="ln"/>
  <text x="786" y="238" class="ts" text-anchor="middle">passes its token on</text>
  <text x="1296" y="238" class="ts" text-anchor="middle">exchanges it</text>

  <g>
    <line x1="40" y1="275" x2="1760" y2="275" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="330" class="tb">Plain token exchange, Keycloak's default policy</text>
    <text x="40" y="372" class="t">The sub-agent also got <tspan font-weight="650">hr.salary</tspan>, a scope nobody granted.</text>
    <text x="40" y="410" class="t">The final token names only the sub-agent: the assistant has gone.</text>
    <rect x="1350" y="300" width="410" height="60" rx="30" class="boxr"/>
    <text x="1555" y="341" fill="#b4532a" font-size="28" font-weight="650" text-anchor="middle">allowed, and widened</text>

    <line x1="40" y1="445" x2="1760" y2="445" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="500" class="tb">Plain token exchange, with the downscope-only policy</text>
    <text x="40" y="542" class="t">Narrowing works; widening is refused. The final token still names</text>
    <text x="40" y="580" class="t">only the sub-agent.</text>
    <rect x="1350" y="470" width="410" height="60" rx="30" class="boxt"/>
    <text x="1555" y="511" class="teal" font-size="28" font-weight="650" text-anchor="middle">allowed, chain lost</text>

    <line x1="40" y1="615" x2="1760" y2="615" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="670" class="tb">Setup 4's token (delegated, bound to the assistant's key)</text>
    <text x="40" y="712" class="mono">"Sender-constrained token exchange rejected as the token was not</text>
    <text x="40" y="746" class="mono"> issued for the requesting client"</text>
    <rect x="1350" y="640" width="410" height="60" rx="30" class="box"/>
    <text x="1555" y="681" class="tb" text-anchor="middle">refused</text>

    <line x1="40" y1="785" x2="1760" y2="785" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="840" class="tb">Delegated token without the key binding</text>
    <text x="40" y="882" class="mono">"Subject token with a delegation claim is not allowed for standard</text>
    <text x="40" y="916" class="mono"> token exchange" / as a delegate: "Invalid may_act claim"</text>
    <rect x="1350" y="810" width="410" height="60" rx="30" class="box"/>
    <text x="1555" y="851" class="tb" text-anchor="middle">refused</text>
  </g>
  <text x="40" y="975" class="ts">Delegation (the act claim) is a preview feature in Keycloak 26.8.1; its guide does not describe passing a delegated token on.</text>
</svg>
