<link rel="stylesheet" href="style.css">
<svg width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4532a"/></marker>
  </defs>
  <text x="40" y="62" class="th">The test company: where identity lives</text>

  <!-- identity provider -->
  <rect x="760" y="110" width="560" height="150" rx="18" class="boxt"/>
  <text x="1040" y="165" class="tb" text-anchor="middle">Identity provider (Keycloak)</text>
  <text x="1040" y="205" class="ts" text-anchor="middle">staff accounts, roles, sign-in, token exchange</text>
  <text x="1040" y="238" class="ts" text-anchor="middle">publishes the keys services use to check tokens</text>

  <!-- person -->
  <rect x="30" y="420" width="240" height="180" rx="18" class="box"/>
  <text x="150" y="480" class="tb" text-anchor="middle">Staff member</text>
  <text x="150" y="522" class="ts" text-anchor="middle">engineer, manager,</text>
  <text x="150" y="554" class="ts" text-anchor="middle">contractor, leaver</text>

  <!-- agent -->
  <rect x="340" y="420" width="290" height="180" rx="18" class="box"/>
  <text x="485" y="480" class="tb" text-anchor="middle">AI agent</text>
  <text x="485" y="522" class="ts" text-anchor="middle">Codex + gpt-5.6-luna</text>
  <text x="485" y="554" class="ts" text-anchor="middle">holds no keys or tokens</text>

  <!-- tool server -->
  <rect x="760" y="400" width="400" height="220" rx="18" class="boxn"/>
  <text x="960" y="462" class="tw" text-anchor="middle">Tool server (MCP)</text>
  <text x="960" y="505" fill="#e3eff3" font-size="25" text-anchor="middle">the only part holding credentials</text>
  <text x="960" y="540" fill="#e3eff3" font-size="25" text-anchor="middle">7 tools: tickets, staff directory,</text>
  <text x="960" y="572" fill="#e3eff3" font-size="25" text-anchor="middle">salaries, expenses</text>

  <!-- services -->
  <rect x="1300" y="330" width="460" height="110" rx="18" class="box"/>
  <text x="1530" y="378" class="tb" text-anchor="middle">HR</text>
  <text x="1530" y="414" class="ts" text-anchor="middle">directory, salaries</text>
  <rect x="1300" y="460" width="460" height="110" rx="18" class="box"/>
  <text x="1530" y="508" class="tb" text-anchor="middle">Expenses</text>
  <text x="1530" y="544" class="ts" text-anchor="middle">claims, approvals</text>
  <rect x="1300" y="590" width="460" height="110" rx="18" class="box"/>
  <text x="1530" y="638" class="tb" text-anchor="middle">Tickets</text>
  <text x="1530" y="674" class="ts" text-anchor="middle">work items, comments</text>
  <text x="1530" y="745" class="ts" text-anchor="middle">each service checks the credential itself</text>
  <text x="1530" y="777" class="ts" text-anchor="middle">and writes an audit log</text>

  <!-- arrows -->
  <path d="M270 510 L332 510" class="ln"/>
  <text x="301" y="495" class="ts" text-anchor="middle">asks</text>
  <path d="M630 510 L752 510" class="ln"/>
  <text x="691" y="495" class="ts" text-anchor="middle">tool call</text>
  <path d="M1160 470 L1292 400" class="ln"/>
  <path d="M1160 510 L1292 515" class="ln"/>
  <path d="M1160 550 L1292 630" class="ln"/>
  <path d="M960 400 L960 268" class="lnt"/>
  <path d="M1000 268 L1000 392" class="lnt"/>
  <text x="1015" y="345" fill="#1f6f8b" font-size="25">sign-in, tokens</text>
  <path d="M1320 200 Q1530 220 1530 322" class="lnt"/>
  <text x="1420" y="190" fill="#1f6f8b" font-size="25">keys</text>
  <path d="M150 420 Q150 185 752 170" class="lnt"/>
  <text x="190" y="150" fill="#1f6f8b" font-size="25">signs in (in setup 4, also consents)</text>

  <!-- planted -->
  <path d="M1300 690 Q900 850 500 608" class="lnr"/>
  <rect x="610" y="790" width="560" height="96" rx="14" class="boxr"/>
  <text x="890" y="830" fill="#b4532a" font-size="27" font-weight="650" text-anchor="middle">Data the agent reads can carry</text>
  <text x="890" y="866" fill="#b4532a" font-size="27" font-weight="650" text-anchor="middle">planted requests</text>
</svg>
