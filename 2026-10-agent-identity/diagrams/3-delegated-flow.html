<link rel="stylesheet" href="style.css">
<style>.halo { paint-order: stroke; stroke: #fff; stroke-width: 9px; stroke-linejoin: round; }</style>
<svg width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4532a"/></marker>
  </defs>
  <text x="40" y="62" class="th">Setup 4: one approval, step by step</text>
  <text x="40" y="104" class="ts">Bob asks the agent to clear his expense queue. Every arrow below happened in the test runs.</text>

  <!-- lifeline heads -->
  <g>
    <rect x="50" y="135" width="230" height="70" rx="14" class="box"/><text x="165" y="181" class="tb" text-anchor="middle">Bob</text>
    <rect x="400" y="135" width="230" height="70" rx="14" class="box"/><text x="515" y="181" class="tb" text-anchor="middle">AI agent</text>
    <rect x="760" y="135" width="280" height="70" rx="14" class="boxn"/><text x="900" y="181" class="tw" text-anchor="middle">Tool server</text>
    <rect x="1150" y="135" width="250" height="70" rx="14" class="boxt"/><text x="1275" y="181" class="tb" text-anchor="middle">Keycloak</text>
    <rect x="1500" y="135" width="260" height="70" rx="14" class="box"/><text x="1630" y="181" class="tb" text-anchor="middle">Expenses</text>
  </g>
  <g stroke="#b9b2a0" stroke-width="2" stroke-dasharray="6 8">
    <line x1="165" y1="205" x2="165" y2="1050"/><line x1="515" y1="205" x2="515" y2="1050"/>
    <line x1="900" y1="205" x2="900" y2="1050"/><line x1="1275" y1="205" x2="1275" y2="1050"/>
    <line x1="1630" y1="205" x2="1630" y2="1050"/>
  </g>

  <!-- 1 sign in -->
  <circle cx="40" cy="262" r="20" fill="#1f6f8b"/><text x="40" y="272" class="tw" font-size="24" text-anchor="middle">1</text>
  <path d="M165 262 L1267 262" class="lnt"/>
  <text x="190" y="248" class="t halo" font-size="27">signs in; consent screen: "let the assistant act for you: read and approve expenses"</text>
  <path d="M1275 322 L908 322" class="lnt"/>
  <text x="1255" y="308" class="ts halo" text-anchor="end">sign-in token, may_act: assistant, bound to the tool server's key</text>

  <!-- 2 tool call -->
  <circle cx="40" cy="402" r="20" fill="#1d2a44"/><text x="40" y="412" class="tw" font-size="24" text-anchor="middle">2</text>
  <path d="M515 402 L892 402" class="ln"/>
  <text x="530" y="388" class="t halo" font-size="27">approve_expense EXP-7</text>

  <!-- 3 exchange -->
  <circle cx="40" cy="482" r="20" fill="#1f6f8b"/><text x="40" y="492" class="tw" font-size="24" text-anchor="middle">3</text>
  <path d="M900 482 L1267 482" class="lnt"/>
  <text x="920" y="468" class="t halo" font-size="27">token exchange</text>
  <text x="920" y="520" class="ts">sign-in token, agent's own</text>
  <text x="920" y="552" class="ts">token, key proof; asks for</text>
  <text x="920" y="584" class="ts">expenses-api, approve only</text>
  <rect x="1295" y="455" width="310" height="140" rx="12" class="boxt"/>
  <text x="1318" y="494" class="ts">checks: user consented,</text>
  <text x="1318" y="526" class="ts">agent matches may_act,</text>
  <text x="1318" y="558" class="ts">scope only narrows</text>

  <!-- 4 token back -->
  <circle cx="40" cy="632" r="20" fill="#1f6f8b"/><text x="40" y="642" class="tw" font-size="24" text-anchor="middle">4</text>
  <path d="M1275 632 L908 632" class="lnt"/>
  <rect x="560" y="650" width="690" height="110" rx="12" class="boxt"/>
  <text x="580" y="692" class="mono">sub: bob  act: assistant  aud: expenses-api</text>
  <text x="580" y="732" class="mono">scope: expenses.approve  2 min  key-bound</text>

  <!-- 5 call service -->
  <circle cx="40" cy="812" r="20" fill="#1d2a44"/><text x="40" y="822" class="tw" font-size="24" text-anchor="middle">5</text>
  <path d="M900 812 L1622 812" class="ln"/>
  <text x="920" y="798" class="t halo" font-size="27">POST /expenses/EXP-7/approve  + token + fresh key proof</text>
  <rect x="1300" y="832" width="460" height="140" rx="12" class="box"/>
  <text x="1318" y="871" class="ts">checks signature, audience, scope,</text>
  <text x="1318" y="903" class="ts">key proof; then the business rule:</text>
  <text x="1318" y="935" class="ts">is Bob the claimant's manager?</text>

  <!-- 6 hold -->
  <circle cx="40" cy="1012" r="20" fill="#b4532a"/><text x="40" y="1022" class="tw" font-size="24" text-anchor="middle">6</text>
  <path d="M900 1012 L173 1012" class="lnr"/>
  <text x="200" y="998" class="halo" fill="#b4532a" font-size="27" font-weight="650">over 1,000, or a salary: held, and Bob asked to confirm</text>
</svg>
