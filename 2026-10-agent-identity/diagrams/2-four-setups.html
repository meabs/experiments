<link rel="stylesheet" href="style.css">
<svg width="1800" height="1060" viewBox="0 0 1800 1060">
  <text x="40" y="62" class="th">What a service receives from the agent, in each setup</text>
  <text x="40" y="104" class="ts">The tool server sends this with every call. Examples from the test runs (tokens decoded).</text>

  <text x="1350" y="168" class="tb" text-anchor="middle">User</text>
  <text x="1350" y="198" class="ts" text-anchor="middle">proven</text>
  <text x="1530" y="168" class="tb" text-anchor="middle">Agent</text>
  <text x="1530" y="198" class="ts" text-anchor="middle">named</text>
  <text x="1700" y="168" class="tb" text-anchor="middle">Limited</text>
  <text x="1700" y="198" class="ts" text-anchor="middle">to the task</text>

  <g id="rows">
    <!-- row 1 -->
    <line x1="40" y1="222" x2="1760" y2="222" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="282" class="tb">1. Shared key</text>
    <text x="40" y="320" class="ts">one key for every bot</text>
    <rect x="390" y="240" width="830" height="170" rx="12" class="box"/>
    <text x="415" y="290" class="mono">X-Api-Key: acme-integration-key…</text>
    <text x="415" y="325" class="mono muted">      (the same for every bot, never expires)</text>
    <text x="415" y="365" class="mono">X-On-Behalf-Of: alice</text>
    <text x="415" y="398" class="mono muted">      (written by the caller; nothing proves it)</text>
    <text x="1350" y="335" class="red tb" text-anchor="middle">no</text>
    <text x="1530" y="335" class="red tb" text-anchor="middle">no</text>
    <text x="1700" y="335" class="red tb" text-anchor="middle">no</text>

    <!-- row 2 -->
    <line x1="40" y1="430" x2="1760" y2="430" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="490" class="tb">2. User's token</text>
    <text x="40" y="528" class="ts">passed straight through</text>
    <rect x="390" y="448" width="830" height="170" rx="12" class="box"/>
    <text x="415" y="498" class="mono">Authorization: Bearer eyJ…</text>
    <text x="415" y="538" class="mono">  sub: alice   aud: hr, expenses, tickets</text>
    <text x="415" y="573" class="mono">  scope: all six API scopes   expires: 60 min</text>
    <text x="415" y="606" class="mono muted">  (works for anyone holding it, at every service)</text>
    <text x="1350" y="543" class="teal tb" text-anchor="middle">yes</text>
    <text x="1530" y="543" class="red tb" text-anchor="middle">no</text>
    <text x="1700" y="543" class="red tb" text-anchor="middle">no</text>

    <!-- row 3 -->
    <line x1="40" y1="638" x2="1760" y2="638" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="698" class="tb">3. Agent service</text>
    <text x="40" y="734" class="tb">account</text>
    <text x="40" y="770" class="ts">the agent's own identity</text>
    <rect x="390" y="656" width="830" height="170" rx="12" class="box"/>
    <text x="415" y="706" class="mono">Authorization: Bearer eyJ…</text>
    <text x="415" y="741" class="mono">  sub: service-account-assistant-svc</text>
    <text x="415" y="776" class="mono">  roles: hr, finance-approver   expires: 60 min</text>
    <text x="415" y="811" class="mono">X-On-Behalf-Of: alice   <tspan class="muted">(claimed)</tspan></text>
    <text x="1350" y="751" class="red tb" text-anchor="middle">no</text>
    <text x="1530" y="751" class="teal tb" text-anchor="middle">yes</text>
    <text x="1700" y="751" class="red tb" text-anchor="middle">no</text>

    <!-- row 4 -->
    <line x1="40" y1="846" x2="1760" y2="846" stroke="#e8eaed" stroke-width="2"/>
    <text x="40" y="906" class="tb">4. Delegated,</text>
    <text x="40" y="942" class="tb">task-scoped</text>
    <text x="40" y="978" class="ts">a new token per call</text>
    <rect x="390" y="864" width="830" height="180" rx="12" class="boxt"/>
    <text x="415" y="912" class="mono">Authorization: DPoP eyJ…   DPoP: proof signed</text>
    <text x="415" y="945" class="mono">  by the tool server's private key</text>
    <text x="415" y="982" class="mono">  sub: alice   act: assistant   aud: tickets-api</text>
    <text x="415" y="1017" class="mono">  scope: tickets.read   expires: 2 min</text>
    <text x="1350" y="959" class="teal tb" text-anchor="middle">yes</text>
    <text x="1530" y="959" class="teal tb" text-anchor="middle">yes</text>
    <text x="1700" y="959" class="teal tb" text-anchor="middle">yes</text>
  </g>
</svg>
