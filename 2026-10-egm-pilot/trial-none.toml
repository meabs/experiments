# Pilot baseline: the LOWSTOCK feature, task only, Codex low effort. Paths are for /Users/garry.
name = "egm-pilot-none"

[defaults]
reps = 2
parallel = 2
timeout = 2700
baseline = "none"
claim = true

[[repos]]
name = "shopizer"
source = "/Users/garry/code/benchmark/skills-impact-work/shopizer"
ref = "6a4a0a6"

[[arms]]
name = "none"
setup = ["bash /Users/garry/code/experiments/2026-10-egm-pilot/scripts/setup.sh"]
parallel_setup = true

[[agents]]
name = "codex"
model = "gpt-5.6-luna"
args = ["-c", "model_reasoning_effort=\"low\""]
edits = true
sandbox = "danger-full-access"
env = { HOME = "/Users/garry/code/benchmark/skills-impact-work/home-clean", CODEX_HOME = "/Users/garry/code/benchmark/skills-impact-work/home-clean/.codex", JAVA_HOME = "/opt/homebrew/opt/openjdk@21", PATH = "/opt/homebrew/opt/openjdk@21/bin:/Users/garry/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
isolate = ["/Users/garry/code/experiments", "/Users/garry/.agents", "/Users/garry/.claude", "/Users/garry/.cursor", "/Users/garry/.codex"]

[[questions]]
id = "LOWSTOCK"
repo = "shopizer"
verify = "bash /Users/garry/code/experiments/2026-10-egm-pilot/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Merchants want to see which products are running low, so they can reorder in time. Add a low-stock report to the admin REST API.

GET /api/v1/private/products/low-stock?store={store code}&threshold={n}

- It is an admin endpoint, protected like the other /api/v1/private endpoints.
- A product's stock is the total quantity across all of its inventory entries (usually one, created with the product). A product with no inventory entries has a stock of 0.
- The report lists every product of the requested store whose stock is at or below the threshold. Products of other stores are never listed.
- threshold is optional and defaults to 5. A negative or non-numeric threshold is rejected with HTTP 400 Bad Request.
- The response is HTTP 200 with a JSON body: {"threshold": n, "totalCount": k, "items": [{"id": productId, "sku": "...", "stock": total}, ...]}. "threshold" is the threshold used, "totalCount" the number of matching products across all pages.
- Items are ordered by stock, lowest first, then by sku, A to Z.
- The report is paged with the query parameters page (0-based, default 0) and count (items per page, default 20).

When you have finished, reply with one short paragraph saying what you changed."""
