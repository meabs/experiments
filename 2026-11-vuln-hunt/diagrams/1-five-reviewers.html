<link rel="stylesheet" href="style.css">
<svg width="1800" height="1060" viewBox="0 0 1800 1060">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
  </defs>
  <text x="40" y="62" class="th">Five ways to review the same app</text>
  <text x="40" y="104" class="ts">Beige: Codex's own harness. Teal: built with Strands Agents. All five: the same task text and gpt-5.6-luna at medium effort.</text>

  <text x="40"   y="170" class="tb">A. Codex</text>
  <text x="40"   y="204" class="ts">as it comes</text>
  <text x="390"  y="170" class="tb">A2. Codex + checklist</text>
  <text x="390"  y="204" class="ts">same harness</text>
  <text x="740"  y="170" class="tb">B. Specialist</text>
  <text x="740"  y="204" class="ts">one Strands agent</text>
  <text x="1090" y="170" class="tb">C. Team (Graph)</text>
  <text x="1090" y="204" class="ts">order fixed in code</text>
  <text x="1440" y="170" class="tb">D. Swarm</text>
  <text x="1440" y="204" class="ts">agents pick who's next</text>

  <!-- A -->
  <rect x="40" y="240" width="320" height="480" rx="16" class="box"/>
  <text x="200" y="300" class="t" text-anchor="middle">Codex CLI</text>
  <text x="200" y="350" class="ts" text-anchor="middle">its own system prompt</text>
  <text x="200" y="384" class="ts" text-anchor="middle">a shell in a sandbox</text>
  <text x="200" y="418" class="ts" text-anchor="middle">web search off</text>
  <text x="200" y="500" class="ts" text-anchor="middle">"Review this repository</text>
  <text x="200" y="534" class="ts" text-anchor="middle">for security</text>
  <text x="200" y="568" class="ts" text-anchor="middle">vulnerabilities."</text>
  <text x="200" y="660" class="ts" text-anchor="middle">one turn</text>

  <!-- A2 -->
  <rect x="390" y="240" width="320" height="480" rx="16" class="box"/>
  <text x="550" y="300" class="t" text-anchor="middle">Codex CLI</text>
  <text x="550" y="350" class="ts" text-anchor="middle">set up exactly as A</text>
  <rect x="420" y="400" width="260" height="110" rx="12" class="boxt"/>
  <text x="550" y="446" class="ts" text-anchor="middle">+ the specialist's</text>
  <text x="550" y="480" class="ts" text-anchor="middle">checklist</text>
  <rect x="420" y="530" width="260" height="110" rx="12" class="boxt"/>
  <text x="550" y="576" class="ts" text-anchor="middle">+ a running copy</text>
  <text x="550" y="610" class="ts" text-anchor="middle">of the app (curl)</text>
  <text x="550" y="690" class="ts" text-anchor="middle">one turn</text>

  <!-- B -->
  <rect x="740" y="240" width="320" height="480" rx="16" class="boxt"/>
  <text x="900" y="300" class="t" text-anchor="middle">Security reviewer</text>
  <text x="900" y="350" class="ts" text-anchor="middle">checklist following</text>
  <text x="900" y="384" class="ts" text-anchor="middle">OWASP's categories;</text>
  <text x="900" y="418" class="ts" text-anchor="middle">evidence required</text>
  <text x="900" y="490" class="ts" text-anchor="middle">tools:</text>
  <text x="900" y="526" class="mono" text-anchor="middle">list_files</text>
  <text x="900" y="560" class="mono" text-anchor="middle">read_file</text>
  <text x="900" y="594" class="mono" text-anchor="middle">search_code</text>
  <text x="900" y="628" class="mono" text-anchor="middle">http_request</text>
  <text x="900" y="680" class="ts" text-anchor="middle">(the local app only)</text>

  <!-- C -->
  <rect x="1090" y="240" width="320" height="90" rx="16" class="boxt"/>
  <text x="1250" y="295" class="t" text-anchor="middle">Recon</text>
  <path d="M1250 330 V 368" class="ln"/>
  <rect x="1090" y="370" width="150" height="70" rx="12" class="boxt"/>
  <text x="1165" y="414" class="ts" text-anchor="middle">injection</text>
  <rect x="1260" y="370" width="150" height="70" rx="12" class="boxt"/>
  <text x="1335" y="414" class="ts" text-anchor="middle">access, auth</text>
  <rect x="1090" y="455" width="150" height="70" rx="12" class="boxt"/>
  <text x="1165" y="499" class="ts" text-anchor="middle">crypto, deps</text>
  <rect x="1260" y="455" width="150" height="70" rx="12" class="boxt"/>
  <text x="1335" y="499" class="ts" text-anchor="middle">logic, errors</text>
  <text x="1250" y="560" class="ts" text-anchor="middle">in parallel; all four finish</text>
  <path d="M1250 575 V 618" class="ln"/>
  <rect x="1090" y="620" width="320" height="100" rx="16" class="boxt"/>
  <text x="1250" y="665" class="t" text-anchor="middle">Verifier</text>
  <text x="1250" y="700" class="ts" text-anchor="middle">checks, then submits</text>

  <!-- D -->
  <rect x="1440" y="240" width="320" height="480" rx="16" class="boxt"/>
  <text x="1600" y="300" class="t" text-anchor="middle">The same six agents</text>
  <text x="1600" y="350" class="ts" text-anchor="middle">recon, four specialists,</text>
  <text x="1600" y="384" class="ts" text-anchor="middle">verifier; same prompts</text>
  <text x="1600" y="470" class="ts" text-anchor="middle">each agent hands off</text>
  <text x="1600" y="504" class="ts" text-anchor="middle">to the one it chooses</text>
  <path d="M1690 530 C 1740 570, 1740 620, 1690 650" class="lnt"/>
  <text x="1600" y="600" class="ts" text-anchor="middle">one hand-off a turn</text>
  <text x="1600" y="690" class="ts" text-anchor="middle">the verifier submits</text>

  <text x="1250" y="760" class="ts" text-anchor="middle">Strands Graph</text>
  <text x="1600" y="760" class="ts" text-anchor="middle">Strands Swarm</text>

  <rect x="40" y="800" width="1720" height="220" rx="18" class="boxn"/>
  <text x="900" y="862" class="tw" text-anchor="middle">The same app: a Flask shop API of about 1,200 lines</text>
  <text x="900" y="914" fill="#e8eaed" font-size="25" text-anchor="middle">23 planted vulnerabilities across all ten OWASP Top 10:2025 categories, easy to very hard</text>
  <text x="900" y="954" fill="#e8eaed" font-size="25" text-anchor="middle">6 decoys that look risky but are safe · proof tests the reviewers never see</text>
  <text x="900" y="994" fill="#e8eaed" font-size="25" text-anchor="middle">Every reviewer writes its findings to FINDINGS.json</text>
</svg>
