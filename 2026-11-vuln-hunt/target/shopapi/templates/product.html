<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ product.name }} · Hartley & Finch</title></head>
<body>
  <h1>{{ product.name }}</h1>
  <p class="price">£{{ "%.2f"|format(product.price_pence / 100) }}</p>
  {% if product.image %}<img src="/images/{{ product.image }}" alt="{{ product.name }}">{% endif %}
  <div class="description">{{ description|safe }}</div>
  <h2>Reviews</h2>
  {% for r in reviews %}
  <article class="review">
    <p class="stars">{{ "★" * r.rating }}</p>
    <div class="review-body">{{ r.body|safe }}</div>
    <p class="author">{{ r.author_name }}</p>
  </article>
  {% else %}
  <p>No reviews yet.</p>
  {% endfor %}
</body>
</html>
