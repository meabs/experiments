# Throwaway CODEX_HOME for local-model runs (never ~/.codex). Codex CLI 0.157.0.
model_provider = "ollama-local"
model = "qwen3.8:27b"
model_context_window = 65536
model_auto_compact_token_limit = 56000
model_reasoning_effort = "low"
model_catalog_json = "~/code/benchmark/local-setup/codex-home/catalog.json"   # absolute path on the machine; codex-bwrap.sh rewrites it per run

[model_providers.ollama-local]
name = "Ollama (local, ROCm)"
base_url = "http://127.0.0.1:11434/v1"
wire_api = "responses"
env_key = "OLLAMA_API_KEY"          # Ollama ignores it; set OLLAMA_API_KEY=ollama
requires_openai_auth = false
request_max_retries = 2
stream_idle_timeout_ms = 900000     # slow local prefill on long prompts
