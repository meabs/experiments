  <text x="65" y="506" class="ts">579 words · "Read before any change"</text>
  <text x="65" y="552" class="mono muted">---</text>
  <text x="65" y="584" class="mono muted">type: guide</text>
  <text x="65" y="616" class="mono muted">title: System information</text>
  <text x="65" y="648" class="mono muted">status: stable</text>
  <text x="65" y="680" class="mono muted">generated: by human:accounts-squad</text>
  <text x="65" y="712" class="mono muted">sources: [/context.md, README.md]</text>
  <text x="65" y="744" class="mono muted">---</text>
  <text x="65" y="796" class="t" font-weight="650"># What it is</text>
  <text x="85" y="832" class="q">system of record for the customer's view;</text>
  <text x="85" y="862" class="q">does not hold the money (the ledger does)</text>
  <text x="65" y="912" class="t" font-weight="650"># Build, run, test</text>
  <text x="65" y="962" class="t" font-weight="650"># Key pitfalls (eight)</text>
  <text x="85" y="1000" class="q">1 the balance here is a copy (02:00)</text>
  <text x="85" y="1036" class="q">2 ledger reference = idempotency key</text>
  <text x="85" y="1072" class="q">3 every payment fraud-screened (FRD-7);</text>
  <text x="85" y="1102" class="q">   REFER = hold, fails closed</text>
  <text x="85" y="1138" class="q">4 never refuse a payment for the time</text>
  <text x="85" y="1174" class="q">5 a scheme timeout may be accepted</text>
  <text x="85" y="1210" class="q">6 last four digits only in messages</text>
  <text x="85" y="1246" class="q">7–8 UK time via Clock; access rules</text>

  <rect x="625" y="425" width="550" height="880" rx="14" class="box"/>
  <text x="650" y="472" class="tb">okf/architecture.md</text>
  <text x="650" y="506" class="ts">649 words · "Read before touching payment"</text>
  <text x="650" y="556" class="t" font-weight="650"># Components</text>
  <text x="650" y="606" class="t" font-weight="650"># The payment flow</text>
  <text x="670" y="642" class="q">checks → screen → scheme → ledger → notify</text>
  <text x="650" y="692" class="t" font-weight="650"># External systems</text>
  <text x="670" y="736" class="q" font-weight="650">## Payment scheme gateway</text>
  <text x="690" y="772" class="q">cut-off 15:30 (DT01); reference unique</text>
  <text x="690" y="802" class="q">30 days, <tspan class="red" font-weight="650">DUPL on a repeat</tspan>; timeout 10 s</text>
  <text x="690" y="832" class="q">"may mean accepted"; status query</text>
  <text x="670" y="880" class="q" font-weight="650">## Fraud screening</text>
  <text x="690" y="916" class="q">ACCEPT / REFER / REJECT; 2 s; fail closed</text>
  <text x="670" y="964" class="q" font-weight="650">## Core ledger</text>
  <text x="690" y="1000" class="q">reference books once in 24 h; a timeout</text>
  <text x="690" y="1030" class="q">may have booked; POSTING_FAILED</text>
  <text x="670" y="1078" class="q" font-weight="650">## Customer notifications</text>
  <text x="690" y="1114" class="q">templates PAYMENT_SENT, PAYMENT_QUEUED,</text>
  <text x="690" y="1144" class="q">PAYMENT_UNDER_REVIEW, <tspan class="red" font-weight="650">PAYMENT_FAILED</tspan></text>
  <text x="690" y="1174" class="q">last four digits only; best effort</text>

  <text x="1255" y="646" class="q">## Paying someone</text>
  <text x="1275" y="680" class="q">REFER held 4 h; queued after 15:30</text>
  <text x="1255" y="722" class="q">## Statements and the regulatory return</text>
  <text x="1275" y="756" class="q">cut on the 1st; return by 5th working day</text>
  <text x="1255" y="798" class="q">## Closing an account</text>
  <text x="1275" y="832" class="q"><tspan class="red" font-weight="650">zero balance, checked against the ledger</tspan></text>
  <text x="1255" y="874" class="q">## Complaints (8 weeks)</text>
  <text x="1235" y="932" class="t" font-weight="650"># Who depends on it</text>
  <text x="1255" y="970" class="q">customers, back office, finance</text>
  <text x="1255" y="1000" class="q">reconciliation (07:00), fraud team,</text>
  <text x="1255" y="1030" class="q">regulatory reporting, complaints, operations</text>
  <text x="1235" y="1088" class="t" font-weight="650"># Rules from outside the code</text>
  <text x="1255" y="1126" class="q">fraud policy, idempotency, data protection</text>
