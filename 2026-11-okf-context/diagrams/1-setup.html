<link rel="stylesheet" href="style.css">
<svg width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker></defs>
  <text x="40" y="62" class="th">One repository, three set-ups, two kinds of task</text>
  <text x="40" y="102" class="ts">A bank's accounts API (Spring Boot) that pays through a payment scheme, fraud screening, a core ledger and notifications.</text>

  <text x="40" y="170" class="tb">What the agent gets besides the code</text>
  <rect x="40" y="195" width="820" height="150" rx="14" class="box"/>
  <text x="70" y="245" class="tb">A. Vanilla</text>
  <text x="70" y="290" class="t">Nothing. It has to work everything out from the code.</text>

  <rect x="40" y="370" width="820" height="300" rx="14" class="boxt"/>
  <text x="70" y="420" class="tb">B. OKF bundle (about 2,000 words)</text>
  <text x="70" y="465" class="ts">AGENTS.md: one line pointing to okf/index.md</text>
  <text x="90" y="510" class="mono">okf/index.md          which file to read for what</text>
  <text x="90" y="548" class="mono">okf/system.md         build, test, eight key pitfalls</text>
  <text x="90" y="586" class="mono">okf/architecture.md   each external system's rules</text>
  <text x="90" y="624" class="mono">okf/context.md        business processes, dependants</text>

  <rect x="40" y="695" width="820" height="150" rx="14" class="boxg"/>
  <text x="70" y="745" class="tb">C. Plain AGENTS.md</text>
  <text x="70" y="790" class="t">The same facts as a section Codex loads into its prompt.</text>

  <text x="940" y="170" class="tb">Two kinds of task, 25 runs per set-up each</text>
  <rect x="940" y="195" width="820" height="320" rx="14" class="box"/>
  <text x="970" y="245" class="tb">Feature changes: 5 tickets</text>
  <text x="970" y="290" class="t">3 whose rules the code shows (history, cancel, limit)</text>
  <text x="970" y="333" class="t">2 whose rules only the context gives:</text>
  <text x="990" y="376" class="q">F6  resubmit after a scheme timeout (DUPL = "already have it")</text>
  <text x="990" y="412" class="q">F7  notify queued and rejected payments (real template names)</text>
  <text x="970" y="470" class="ts">Graded by hidden tests plus the 34 existing ones.</text>

  <rect x="940" y="540" width="820" height="305" rx="14" class="box"/>
  <text x="970" y="590" class="tb">A service FMEA</text>
  <text x="970" y="635" class="t">"For each way it can fail": cause, effect on customers</text>
  <text x="970" y="675" class="t">and dependants, detection, scores, action.</text>
  <text x="970" y="725" class="t">Graded against a 22-entry answer key written first:</text>
  <text x="990" y="768" class="q">10 visible in the code, 5 inferable, 7 only in the context</text>
  <text x="970" y="815" class="ts">Two judge models from other providers; checked by hand.</text>

  <rect x="40" y="880" width="1720" height="120" rx="14" class="boxn"/>
  <text x="70" y="930" class="tw">Same agent everywhere: Codex CLI with gpt-5.6-luna, medium effort, no network, no one to ask.</text>
  <text x="70" y="975" class="tw" font-weight="400">150 runs in all. The hidden tests and the answer key were never in the agent's sandbox.</text>
  <text x="1760" y="1055" class="tsm" text-anchor="end">Source: github.com/meabs/experiments, 2026-11-okf-context</text>
</svg>
