spring:
  application:
    name: accounts-service
  datasource:
    url: jdbc:h2:mem:accounts;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by the platform's identity service and signed with its key. The public key is enough to
          # check them. (In tests, tokens are signed with the matching dev key in src/test/resources/keys.)
          public-key-location: classpath:keys/public.pem
integrations:
  scheme:
    url: https://scheme-gateway.internal.example/api
    cutoff: "15:30"
    timeout: 10s
  fraud:
    url: https://fraud-screening.internal.example
    timeout: 2s
  ledger:
    url: https://core-ledger.internal.example/api
    timeout: 5s
  notifications:
    url: https://notify.internal.example
logging:
  level:
    root: WARN
