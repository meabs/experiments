# Absolute paths are written for /Users/USER. Run scripts/localize.sh to write *.local.toml with your home folder, and run those.
name = "caveman-gate"

[defaults]
reps = 1
parallel = 3
timeout = 1200
baseline = "none"
claim = true

[[repos]]
name = "shopizer"
source = "/Users/USER/code/benchmark/skills-impact-work/shopizer"
ref = "6a4a0a6"

[[arms]]
name = "none"
setup = ["bash /Users/USER/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true

[[arms]]
name = "slash"
overlay = "arms/caveman"
setup = ["bash /Users/USER/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true
prompt_prefix = "/caveman"
uses = "caveman"

[[arms]]
name = "dollar"
overlay = "arms/caveman"
setup = ["bash /Users/USER/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true
prompt_prefix = "$caveman"
uses = "caveman"

[[agents]]
name = "codex"
model = "gpt-5.6-luna"
args = ["-c", "model_reasoning_effort=\"high\""]
edits = true
sandbox = "danger-full-access"
env = { HOME = "/Users/USER/code/benchmark/skills-impact-work/home-clean", CODEX_HOME = "/Users/USER/code/benchmark/skills-impact-work/home-clean/.codex", JAVA_HOME = "/opt/homebrew/opt/openjdk@21", PATH = "/opt/homebrew/opt/openjdk@21/bin:/Users/USER/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
isolate = ["/Users/USER/code/experiments", "/Users/USER/.agents", "/Users/USER/.claude", "/Users/USER/.cursor", "/Users/USER/.codex"]

[[agents]]
name = "cursor"
model = "grok-4.7-low"
edits = true
env = { JAVA_HOME = "/opt/homebrew/opt/openjdk@21", PATH = "/opt/homebrew/opt/openjdk@21/bin:/Users/USER/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
isolate = ["/Users/USER/code/experiments", "/Users/USER/.agents", "/Users/USER/.claude/skills", "/Users/USER/.claude/plugins", "/Users/USER/.cursor/skills", "/Users/USER/.cursor/plugins", "/Users/USER/.cursor/agents", "/Users/USER/.codex"]

[[questions]]
id = "GATE"
repo = "shopizer"
prompt = """Do not read any files and do not run any commands. Answer two things. 1) List the name of every agent skill available to you in this session, comma separated, as SKILLS: <names>. 2) If any skill's full instructions were already given to you in this conversation (not just its name), list those as LOADED: <names>, otherwise LOADED: none."""
