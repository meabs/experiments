# Absolute paths are written for /Users/USER. Run scripts/localize.sh to write *.local.toml with your home folder. Run this file with --agent cursor only: caveman's invocation differs per agent (see README).
name = "caveman"

[defaults]
reps = 6
parallel = 3
timeout = 1200
baseline = "none"
claim = true

[[repos]]
name = "shopizer"
source = "/Users/USER/code/benchmark/skills-impact-work/shopizer"
ref = "6a4a0a6"

[[arms]]
name = "none"
setup = ["bash /Users/USER/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true

[[arms]]
name = "caveman"
overlay = "arms/caveman"
setup = ["bash /Users/USER/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true
prompt_prefix = "/caveman"
uses = "caveman"

[[agents]]
name = "codex"
model = "gpt-5.6-luna"
args = ["-c", "model_reasoning_effort=\"high\""]
edits = true
sandbox = "danger-full-access"
env = { HOME = "/Users/USER/code/benchmark/skills-impact-work/home-clean", CODEX_HOME = "/Users/USER/code/benchmark/skills-impact-work/home-clean/.codex", JAVA_HOME = "/opt/homebrew/opt/openjdk@21", PATH = "/opt/homebrew/opt/openjdk@21/bin:/Users/USER/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
isolate = ["/Users/USER/code/experiments", "/Users/USER/.agents", "/Users/USER/.claude", "/Users/USER/.cursor", "/Users/USER/.codex"]

[[agents]]
name = "cursor"
model = "grok-4.7-low"
edits = true
env = { JAVA_HOME = "/opt/homebrew/opt/openjdk@21", PATH = "/opt/homebrew/opt/openjdk@21/bin:/Users/USER/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
isolate = ["/Users/USER/code/experiments", "/Users/USER/.agents", "/Users/USER/.claude/skills", "/Users/USER/.claude/plugins", "/Users/USER/.cursor/skills", "/Users/USER/.cursor/plugins", "/Users/USER/.cursor/agents", "/Users/USER/.codex"]

[[questions]]
id = "QA"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-caveman/scripts/qa_verify.sh"
prompt = """You are working in a checkout of a Java e-commerce application (Maven multi-module). Answer the questions below about this repository.

This is one of many similar requests being answered in a batch, so keep the work efficient: use as few steps as you reasonably can.

Write your answers to a file named ANSWER.md in the repository root, one line per question, in the form `M1: ClassA, ClassB, ClassC` (simple class names, comma separated, no packages). After the answers add one more line, `Conflicts: <text>`. If any documentation or generated file in the repository disagreed with the source code while you worked, name the file and the claim there; otherwise write `Conflicts: none`.

Definitions. A class A "references" class B when A, in code under src/main, (a) has a field or constructor parameter whose type is B or a subtype of B, (b) calls a method on a receiver whose type is B or a subtype of B, (c) instantiates B or a subtype of B, or (d) extends or implements B. A class is "affected" by a change to X if it references X directly, or references another affected class (transitively, any depth). Report top-level class names (simple names, no packages); treat a nested class as its outermost class. "Controllers" means classes in the sm-shop module annotated @RestController or @Controller.

Do not modify any file other than ANSWER.md. You do not need to build or run the application (the classes are not compiled; work from the source).

M1. Which controllers are affected by a change to CustomerService?
M2. Which controllers are affected by a change to ProductService?
M3. Which controllers are affected by a change to PricingService?
M4. Which controllers are affected by a change to UserFacade?
M5. Which controllers are affected by a change to StoreFacade?
M6. Which controllers are affected by a change to EmailService?
M7. Which controllers are affected by a change to CountryService?
M8. Which classes (of any kind) are affected by a change to OrderFacade?"""

[[questions]]
id = "BUG"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-skills-impact/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Bug report from a merchant: "I create my products through the admin REST API. When I give a product a special price with an end date, the storefront API never shows the discount, whether or not I also give a start date. Specials with no dates show fine."

Find the cause and fix it. When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "FEAT"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-skills-impact/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Add a limit to the storefront shopping cart REST API: a cart line may hold at most N units of a product. N is a per-store setting, read from the store's merchant configuration under the key CART_MAX_LINE_QUANTITY (a whole number); when a store has no such configuration, N is 99. A change to the setting must take effect without restarting the application.

Any request that would set a line above N units must be rejected with HTTP 400 Bad Request, and the cart must be left exactly as it was. This applies to every storefront endpoint that creates a cart or adds or changes cart items. A quantity of 0 keeps its current meaning (it removes the line).

When you have finished, reply with one short paragraph saying what you changed."""
