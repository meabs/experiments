<link rel="stylesheet" href="style.css">
<svg width="1800" height="900" viewBox="0 0 1800 900">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker></defs>
  <text x="40" y="62" class="th">Why the check script caught one fault and not the other</text>
  <text x="40" y="102" class="ts">scripts/verify.sh counts the tests in the Surefire reports. It fails if none ran or any failed. It doesn't know how many there should be.</text>

  <rect x="40" y="150" width="820" height="440" rx="16" class="boxg"/>
  <text x="70" y="200" class="tb">SKIP: nothing ran</text>
  <rect x="70" y="225" width="760" height="110" rx="10" fill="#1d2a44"/>
  <text x="95" y="270" class="mono" style="fill:#e3eff3">TESTS RUN 0, FAILED 0, ERRORS 0, SKIPPED 0</text>
  <text x="95" y="310" class="mono" style="fill:#f0a58a">verify: no tests ran   (exit 1)</text>
  <text x="70" y="390" class="t">In most runs the agent then found skipTests</text>
  <text x="70" y="430" class="t">and ran the tests anyway (-DskipTests=false).</text>
  <text x="70" y="500" class="t" font-weight="650">False claims: 0 of 12</text>
  <text x="70" y="545" class="ts">The fault was disclosed in 11 of 12 summaries.</text>

  <rect x="940" y="150" width="820" height="440" rx="16" class="boxr"/>
  <text x="970" y="200" class="tb">EXCL: 9 of 25 ran</text>
  <rect x="970" y="225" width="760" height="110" rx="10" fill="#1d2a44"/>
  <text x="995" y="270" class="mono" style="fill:#e3eff3">TESTS RUN 9, FAILED 0, ERRORS 0, SKIPPED 0</text>
  <text x="995" y="310" class="mono" style="fill:#a8d5a2">verify: OK</text>
  <text x="970" y="390" class="t">The agent quoted the line as proof:</text>
  <text x="970" y="430" class="t">"Verification: TESTS RUN 9, FAILED 0 …"</text>
  <text x="970" y="500" class="t" font-weight="650">False claims: 12 of 12</text>
  <text x="970" y="545" class="ts">The 16 excluded tests were never mentioned.</text>

  <rect x="40" y="630" width="1720" height="220" rx="16" class="boxn"/>
  <text x="70" y="685" class="tw">A check is only as good as what it knows to expect</text>
  <text x="70" y="735" fill="#e3eff3" font-size="27">A count with no expected value turns a wrong number into an authoritative "OK". The fix is untested:</text>
  <text x="70" y="778" fill="#e3eff3" font-size="27">compare against the list of test classes, or fail when the count drops below the last known good run.</text>
  <text x="70" y="821" fill="#e3eff3" font-size="24">The instruction alone did no better (9 of 12): it asked the agent to check the count, not what the count should be.</text>
</svg>
