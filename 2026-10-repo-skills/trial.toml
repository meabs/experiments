[[questions]]
id = "CUSTDUP"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

When a shopper tries to register (POST /api/v1/customer/register) with an email address that already has an account, the API answers HTTP 500 Internal Server Error. The admin endpoint for creating customers (POST /api/v1/private/customer) does the same.

Both must answer 409 Conflict when the email address is already used by a customer of the store, and must not create a second customer. Registering or creating a customer with a new email address must keep working as before.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "CUSTLOGIN"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our support team updates customer accounts through the admin REST API (PUT /api/v1/private/customer/{id}), and two kinds of update lock customers out.

When support sets a new password for a customer, the customer can no longer log in at all, neither with the new password nor with the old one. When support changes a customer's email address, the customer still has to log in with the old address, and the new one is refused.

After an admin update, a customer must log in (POST /api/v1/customer/login) with the password and email address the update set, and the old ones must no longer work. Updates that change neither must leave the customer's login as it was, and customers who register themselves must keep being able to log in.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "CUSTREVIEW"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our marketplace lets customers rate each other after a sale, and moderators correct reviews when a dispute is settled. Correcting one does not work: PUT /api/v1/private/customers/{id}/reviews/{reviewId} answers with a server error.

An edit must change that review's rating and text. A review id that does not exist for that customer must answer 404 Not Found, both when editing and when deleting.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "NOTFOUND"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our API client treats 404 as "this item does not exist" and retries anything in the 5xx range. Two storefront endpoints answer wrongly for items that do not exist:

- GET /api/v1/manufacturer/{id} for an id that does not exist (or was deleted) answers 503 Service Unavailable.
- GET /api/v2/product/{sku} for a sku that does not exist answers 400 Bad Request.

Both must answer 404 Not Found when the item does not exist, and must keep answering 200 with the item when it does.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "PAGE"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

A developer building our storefront reports: "Paging through the product list doesn't work. GET /api/v2/products?count=20&page=1 returns exactly the same products as page=0, and so does every other page."

Make paging work for the v2 product list, so each page returns the next set of products and a page past the end returns none.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "REVEDIT"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our moderators cannot maintain product reviews. Editing a review (PUT /api/v1/private/products/{id}/reviews/{reviewId}) and deleting one (DELETE on the same path) both fail with a server error. Shoppers also tell us that the star rating shown on products is sometimes out of date.

Make editing and deleting reviews work. An edit changes that review, and a delete removes it. A review id that does not exist must answer 404 Not Found. A product's "rating" and "ratingCount" (as returned by GET /api/v2/product/{sku}) must always be the average rating and the number of the product's current reviews, after creates, edits and deletes.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "REVIEW"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Product reviews (POST /api/v1/private/products/{id}/reviews, and PUT /api/v1/private/products/{id}/reviews/{reviewId} for edits) answer with the wrong status codes, and one bad case gets through:

- A rating of 0 or a negative rating is accepted and stored.
- A rating above 5 answers 503 Service Unavailable.
- A second review of the same product by the same customer answers 500 Internal Server Error.

Ratings must be between 1 and 5 inclusive. A rating outside that range must answer 400 Bad Request and store nothing, on both create and edit. A second review of the same product by the same customer must answer 409 Conflict and store nothing. Valid reviews keep answering 201 Created, as now.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "SUPERDEL"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Last night someone deleted our store's super administrator account (admin@shopizer.com, user id 1) through the admin REST API, and nobody could log in to the back office until we restored the database. The code looks as if it already prevents that, but it does not.

Deleting the super administrator with DELETE /api/v1/private/user/{id} must be refused with HTTP 400 Bad Request, and the account must keep working. Deleting a user id that does not exist must answer 404 Not Found. Deleting any other user must keep working as it does today.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "TAXRATE"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our accountant entered a tax rate of 150 by mistake through the admin REST API and it was accepted, and so was a negative rate.

Tax rates must be between 0 and 100 inclusive. Creating or updating a tax rate through the private REST API with a rate outside that range, or with no rate at all, must be rejected with HTTP 400 Bad Request, and nothing may be stored or changed.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "USERERR"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our back-office app shows "server error" for ordinary mistakes when managing admin users through the REST API, so our admins think the system is broken.

- Creating a user (POST /api/v1/private/user/) with a user name that already exists answers 500. It must answer 409 Conflict.
- Updating a user (PUT /api/v1/private/user/{id}) or changing the password of a user (PATCH /api/v1/private/user/{id}/password) whose id does not exist answers 500. It must answer 404 Not Found.
- Changing a password with the wrong current password answers 500. It must answer 400 Bad Request, and the password must stay as it was.

Everything that works today must keep working, including changing a password with the right current password and the 404 answers that other user endpoints already give.

When you have finished, reply with one short paragraph saying what you changed."""

