[[questions]]
id = "ADDR"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Support reports that customer delivery addresses are coming out wrong. An admin updates a customer's addresses with PATCH /api/v1/private/customer/{id}/address, sending the billing address and a delivery address. When the customer is read back with GET /api/v1/private/customer/{id}, the delivery street address is missing, the delivery postal code shows the state code, and the delivery state is empty.

Make the delivery address be stored and returned exactly as sent. As before, a field that is missing from the delivery address (street address, city, postal code or country) is taken from the billing address.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "AMBIG"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Looking up a single category through the public REST API is broken. GET /api/v1/category/{id} (for example /api/v1/category/12) returns HTTP 500 Internal Server Error, and so does looking a category up by its friendly URL, GET /api/v1/category/{friendlyUrl} (for example /api/v1/category/dining-chairs).

Make both lookups work: a numeric value is a category id, anything else is a friendly URL. An id or friendly URL that does not exist must return 404 Not Found.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "AVAIL"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

A merchant reports: "When I create a product through the admin REST API (POST /api/v1/private/product) with "available": false, because it is not ready to sell yet, the product still comes back as available: GET /api/v2/product/{sku} shows "available": true."

Make the availability we send when creating a product be the availability that is stored and returned.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "BOXGET"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our storefront shows small content boxes (a footer note, a promotion banner) that the marketing team writes in the back office. The storefront reads each box with GET /api/v1/content/boxes/{code}, and what comes back is not what was saved: the box has no code and no id, it says it is not visible even when it is, and its text arrives wrapped in "<![CDATA[ ... ]]>", which then shows up on the page.

GET /api/v1/content/boxes/{code} must return the box's code, id and visibility as stored, and its text exactly as it was written. The box list and the 404 for an unknown box code must keep working as they do today.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "BOXVIS"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Our marketing team prepares storefront content boxes (banners, footer notes) ahead of time and keeps them hidden (visible = false) until they go live. Shoppers are seeing them early: the storefront's box list (GET /api/v1/content/boxes) includes hidden boxes, and a hidden box can be read at GET /api/v1/content/boxes/{code}.

Hidden boxes must not reach shoppers: the storefront list must leave them out, and reading a hidden box by code from the storefront must answer 404 Not Found.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "CARTCALC"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

A shopper reports: "I put 2 of one product and 3 of another in my cart. Each line shows the price of a single unit instead of the line amount, and the cart subtotal and total are much too low, as if I had bought just one of each."

Each cart line's subtotal must be the unit price times the quantity, and the cart's subtotal and total must count every unit. This applies to the storefront cart API (GET /api/v1/cart/{code} and the responses when items are added).

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "CARTLAST"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Shoppers who empty their cart lose it. If a shopper removes the last product from their cart (DELETE /api/v1/cart/{code}/product/{sku}), or sets the last product's quantity to 0 (PUT /api/v1/cart/{code}), the cart is gone: reading it answers 404, and adding a product to it fails, so our storefront has to start a new cart and the shopper's cart code stops working.

A cart that has been emptied this way must still exist: GET /api/v1/cart/{code} must answer 200 with no products and a subtotal of 0, and adding a product to it must work as it does for any other cart. Removing a product, or setting its quantity to 0, while other products remain must keep working as it does today.

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "CATCOUNT"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Every category returned by the category list REST API (GET /api/v1/category) has a "productCount" field, but it is always 0.

Make productCount show the number of products in the category or in any of its subcategories (at any depth), counting each product once even when it sits in several of those categories. Every category in the list must be right, including the categories nested inside "children".

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "CATDUP"
repo = "shopizer"
verify = "bash /Users/USER/code/experiments/2026-10-repo-skills/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Category codes must be unique within a store. When an admin creates a category with a code that another category already uses (POST /api/v1/private/category), or changes a category's code to one already in use (PUT /api/v1/private/category/{id}), the API answers 500 Internal Server Error, with a raw database error in the message.

Both cases must answer 409 Conflict and store nothing. Updating a category while keeping its own code must keep working.

When you have finished, reply with one short paragraph saying what you changed."""

