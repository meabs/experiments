<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent room</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#16181d;--mute:#5d6470;--line:#dcdde0;--A:#2a78d6;--B:#b8570f;--C:#12805c;--ev:#8a6d00}
body.dark{--bg:#14161a;--panel:#1d2026;--ink:#eceef2;--mute:#a0a7b3;--line:#323740;--A:#6aa9f0;--B:#f0955a;--C:#4ccf9f;--ev:#e6c35a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:1.05rem;margin:0 .5rem 0 0}select,button,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.25rem .6rem}
button{cursor:pointer}main{display:grid;grid-template-columns:1fr 300px;gap:1rem;padding:1rem;max-width:1280px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
#scenario{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.7rem 1rem;margin-bottom:.8rem}
#scenario b{display:block;font-size:.8rem;letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
.msg{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:.5rem .8rem;margin-bottom:.55rem}
.msg.ev{--c:var(--ev)}.msg.stale{border-style:dashed;border-left-style:solid}
.who{font-size:.85rem;color:var(--mute)}.who b{color:var(--c)}.rt{color:var(--mute);font-size:.8rem}
.msg p{margin:.2rem 0 0;white-space:pre-wrap}.msg.new{animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
aside section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;margin-bottom:.8rem}
aside{position:sticky;top:64px;align-self:start}
aside h2{font-size:.8rem;margin:0 0 .4rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.ag{display:flex;justify-content:space-between;padding:.15rem 0}.ag b{color:var(--c)}.st{color:var(--mute)}.st.think{color:var(--ink)}
#bar{display:flex;gap:.6rem;align-items:center;flex:1;min-width:260px}#scrub{flex:1}
.diff{white-space:pre-wrap;font-size:.85rem}.diff ins{background:#2a7a4f33;text-decoration:none}.diff del{background:#b2341f33}
body.pres{font-size:21px}body.pres header .hide,body.pres .stale{display:none}
</style></head><body>
<header><h1>Agent room</h1>
<select id="sess" aria-label="Session"></select>
<span id="bar"><button id="play">Play</button><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Position">
<span id="pos">0/0</span><select id="speed" aria-label="Speed"><option value="1">1×</option><option value="2">2×</option><option value="5" selected>5×</option><option value="20">20×</option></select></span>
<label class="hide"><input type="checkbox" id="live"> Follow live</label>
<button id="pres">Presentation</button><button id="theme">Dark</button></header>
<main><div><div id="scenario"></div><div id="feed"></div></div>
<aside><section><h2>Agents</h2><div id="agents"></div></section>
<section id="docbox" style="display:none"><h2>Shared document <span id="docv"></span></h2><div class="diff" id="doc" style="max-height:420px;overflow:auto"></div></section>
<section><h2>Memory notes</h2><select id="nag"></select> <select id="nver"></select><div class="diff" id="notes" style="margin-top:.5rem"></div></section></aside></main>
<script>
const $=id=>document.getElementById(id);let ev=[],idx=0,timer=null,sess=null,models={};
const col=a=>`var(--${a})`;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function j(u){const r=await fetch(u);return r.json()}
async function init(){const ss=await j('/api/sessions');$('sess').innerHTML=ss.map(s=>`<option value="${s.session}">Session ${s.session} (${s.messages} messages)</option>`).join('');
 if(ss.length){await load(ss[0].session)}}
async function load(s){stop();sess=s;ev=await j('/api/events?session='+s);const st=ev.find(e=>e.kind==='session_start');models=st?JSON.parse(st.text):{};
 idx=0;$('scrub').max=ev.length;$('scrub').value=0;render();notesInit()}
$('sess').onchange=e=>load(+e.target.value);
function render(){const feed=$('feed');feed.innerHTML='';let sc='',status={A:'idle',B:'idle',C:'idle'},curdoc=null;
 const byId={};let num=0;
 for(let i=0;i<idx;i++){const e=ev[i];
  if(['scenario','message','evidence'].includes(e.kind)){e.n=++num}
  if(e.kind==='scenario'){sc=e.text}
  else if(e.kind==='doc'){curdoc=e}
  else if(e.kind==='ask')status[e.agent]='thinking';
  else if(e.kind==='pass')status[e.agent]='silent';
  else if(e.kind==='message'){status[e.agent]='posted';byId[e.n]=e;
   const m=JSON.parse(e.meta||'{}'),d=document.createElement('div');d.className='msg'+(m.stale?' stale':'');d.style.setProperty('--c',col(e.agent));
   d.innerHTML=`<div class="who"><b>Agent ${e.agent}</b> · ${models[e.agent]||''} · #${e.n}${e.reply_to?` <span class="rt">→ replying to #${e.reply_to}${byId[e.reply_to]&&byId[e.reply_to].agent?' (Agent '+byId[e.reply_to].agent+')':''}</span>`:''}${m.stale?' <span class="rt">· written before newer messages</span>':''}</div><p>${esc(e.text)}</p>`;feed.appendChild(d)}
  else if(e.kind==='evidence'){const d=document.createElement('div');d.className='msg ev';d.style.setProperty('--c','var(--ev)');d.innerHTML=`<div class="who"><b>Evidence delivered to the room</b></div><p>${esc(e.text)}</p>`;feed.appendChild(d)}}
 $('scenario').innerHTML=sc?`<b>Session ${sess}</b>${esc(sc)}`:'';
 $('agents').innerHTML=['A','B','C'].map(a=>`<div class="ag"><span><b style="color:${col(a)}">Agent ${a}</b> <span class="st">${models[a]||''}</span></span><span class="st ${status[a]==='thinking'?'think':''}">${status[a]}</span></div>`).join('');
 $('docbox').style.display=curdoc?'block':'none';if(curdoc){const m=JSON.parse(curdoc.meta||'{}');$('docv').textContent='v'+m.version+' by Agent '+curdoc.agent;$('doc').textContent=curdoc.text}
 $('scrub').value=idx;$('pos').textContent=idx+'/'+ev.length;
 if(!window.scrubbing&&feed.lastChild)feed.lastChild.scrollIntoView({block:'end'})}
function step(){if(idx>=ev.length){stop();return}idx++;render();const a=ev[idx-1],b=ev[idx];
 const gap=b?Math.min((b.ts-a.ts)*1000,4000)/(+$('speed').value):0;timer=setTimeout(step,Math.max(gap,60))}
function stop(){clearTimeout(timer);timer=null;$('play').textContent='Play'}
$('play').onclick=()=>{if(timer){stop();return}if(idx>=ev.length)idx=0;$('play').textContent='Pause';step()};
$('scrub').oninput=e=>{stop();idx=+e.target.value;render()};
$('pres').onclick=()=>document.body.classList.toggle('pres');
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light':'Dark'};
setInterval(async()=>{if(!$('live').checked||!sess)return;const last=ev.length?ev[ev.length-1].id:0,n=await j(`/api/events?session=${sess}&after=${last}`);
 if(n.length){const follow=idx===ev.length;ev=ev.concat(n);$('scrub').max=ev.length;if(follow){idx=ev.length}render()}},1000);
// memory panel: notes events by session, with a word-level diff against the previous version
async function notesInit(){const all={};for(const o of $('sess').options){const e=await j('/api/events?session='+o.value);e.filter(x=>x.kind==='notes').forEach(x=>{(all[x.agent]=all[x.agent]||[]).push({s:+o.value,t:x.text})})}
 window.NOTES=all;const ags=Object.keys(all).sort();$('nag').innerHTML=ags.map(a=>`<option>${a}</option>`).join('');$('nag').onchange=nver;nver()}
function nver(){const l=(window.NOTES||{})[$('nag').value]||[];$('nver').innerHTML=l.map((n,i)=>`<option value="${i}">after session ${n.s}</option>`).join('');$('nver').onchange=shownote;shownote()}
function shownote(){const l=(window.NOTES||{})[$('nag').value]||[],i=+$('nver').value||0;if(!l[i]){$('notes').textContent='';return}
 const cur=l[i].t,prev=i?l[i-1].t:'';const pw=new Set(prev.split(/\s+/)),cw=new Set(cur.split(/\s+/));
 $('notes').innerHTML=cur.split(/(\s+)/).map(w=>/\S/.test(w)&&prev&&!pw.has(w)?`<ins>${esc(w)}</ins>`:esc(w)).join('')+(prev?'<hr>'+prev.split(/(\s+)/).filter(w=>/\S/.test(w)&&!cw.has(w)).map(w=>`<del>${esc(w)}</del>`).join(' '):'')}
init();
</script></body></html>
