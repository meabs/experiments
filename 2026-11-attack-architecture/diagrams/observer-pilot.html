<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b2330;--mute:#667085;--line:#d6dae1;--zone:#eef1f5;--node:#fff;--nodeb:#9aa4b2;

:root[data-theme=dark]{--bg:#0f141b;--panel:#171e28;--ink:#e7ebf1;--mute:#93a0b2;--line:#2b3544;--zone:#141b25;--node:#1d2633;--nodeb:#5b6879;--red:#ff6259;--green:#38c98a;--gold:#f0b429;--blue:#5b9cf0;--orange:#f08a5d;--aqua:#34c796}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
header{padding:16px 16px 8px;max-width:1280px;margin:auto}h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mute);margin:0}
.demo{display:inline-block;background:var(--gold);color:#111;font-weight:600;padding:2px 8px;border-radius:6px;font-size:12px;margin-left:8px;vertical-align:middle}
main{max-width:1280px;margin:auto;padding:0 16px 32px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.p{background:var(--blue);border-color:var(--blue);color:#fff}input[type=range]{flex:1;min-width:120px}
svg{width:100%;height:auto;display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px}.stat b{font-size:24px;display:block;line-height:1.1}.stat span{color:var(--mute);font-size:12px}
.d{font-size:12px;font-weight:600}.up{color:var(--red)}.down{color:var(--green)}
#log{font-size:14px}#log li{margin:3px 0}.add{color:var(--green)}.rem{color:var(--red)}.mute{color:var(--mute)}
h3{font-size:13px;margin:12px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mute);font-size:12px;margin-top:8px}
.msg{min-height:44px;font-weight:600}
@keyframes dash{to{stroke-dashoffset:-24}}@keyframes pulse{50%{opacity:.35}}
.hot{stroke:var(--red)!important;stroke-width:3.5!important;stroke-dasharray:8 4;animation:dash .5s linear infinite}
.pwn{animation:pulse .8s ease-in-out infinite}.ghost{opacity:.45}
text{fill:var(--ink)}.zl{fill:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

<header><h1>Attack my architecture <span id="demo" class="demo" hidden>DEMO: scripted players, no model, not a result</span></h1>
<p class="sub">A red agent attacks a model of a system. The defender changes the live design. Do the changes make it safer, or only bigger?</p></header>
<main>
<section class="card"><div class="bar">
<label>System <select id="fx"></select></label><label>Defender <select id="arm"></select></label>
<button id="prev">&larr;</button><button id="play" class="p">Play</button><button id="next">&rarr;</button>
<input id="sl" type="range" min="0" value="0"><label>Speed <select id="sp"><option value="1.6">slow</option><option value="1" selected>normal</option><option value=".5">fast</option></select></label></div>
<div class="msg" id="msg"></div><svg id="map" viewBox="0 30 1100 600" role="img" aria-label="architecture map"></svg>
<div class="legend" id="legend"></div></section>
<aside><div class="card"><div class="stats" id="stats"></div><h3>This round</h3><ul id="log" style="padding-left:18px;margin:0"></ul></div>

 const rn=ph.r+1;let msg;
 if(atk){msg=r.seq.length?`Round ${rn}: red attacks — ${si?human(r.seq[si-1],r.before):"looking for a way in…"}${si==r.seq.length?`<br><span class="rem">Breached ${r.before.components[r.jewel].label}.</span>`:""}`:`Round ${rn}: red finds no way in.`}
 else msg=r.ops.length?`Round ${rn}: defender changes the live design.`:`Round ${rn}: no change.`;
 $("msg").innerHTML=msg;
 let L="";if(atk)L=r.seq.map((s,i)=>`<li class="${i<si?"":"mute"}">${human(s,r.before)}</li>`).join("")||`<li class="mute">no attack path</li>`;
 else L=r.ops.map(o=>{const k=o.op;const cls=k.startsWith("add")?"add":k.startsWith("remove")?"rem":"";return `<li class="${cls}">${k.replace("_"," ")} ${o.id||o.component}${o.name?" ("+o.name+")":""}${o.field?` ${o.field}→${o.value}`:""}</li>`}).join("")||`<li class="mute">nothing changed</li>`;
 if(r.errors.length)L+=r.errors.map(e=>`<li class="rem">rejected: ${e}</li>`).join("");$("log").innerHTML=L;
 const M=atk?r.mb:r.ma,B=ph.r?G.rounds[ph.r-1].ma:G.start;const st=(lab,v,b,bad)=>`<div class="stat"><b>${v}</b><span>${lab}</span> ${v!=b?`<span class="d ${(v>b)==bad?"up":"down"}">${v>b?"+":""}${v-b}</span>`:""}</div>`;
 $("stats").innerHTML=st("attack paths",M.paths,B.paths,true)+st("complexity",M.complexity,G.start.complexity,true)+st("business flows broken",M.flows_broken.length,0,true);
 $("sl").value=pi;
 $("legend").innerHTML=`<span><b style="color:var(--gold)">▭</b> crown jewel</span><span style="color:var(--red)">● unmitigated weakness</span><span style="color:var(--red)">● plaintext credential</span><span style="color:var(--aqua)">● vaulted credential</span><span style="color:var(--blue)">● short-lived credential</span><span>dotted = untrusted data relay</span><span class="add">green = added</span><span class="rem">red dashed = removed</span><span style="color:var(--aqua)">▮ mitigation</span>`}
const SC=s=>({none:0,read:1,write:2,admin:3})[s];
function charts(){const games=GAMES.filter(g=>g.fixture==G.fixture);
 [["c1",m=>m.paths],["c2",m=>m.complexity]].forEach(([id,f])=>{const s=$(id);s.innerHTML="";const W=320,H=170,L=32,R=96,T=10,B=24;
  const ser=games.map(g=>({g,v:[f(g.start),...g.rounds.map(r=>f(r.ma))]}));const n=Math.max(...ser.map(x=>x.v.length)),mx=Math.max(...ser.flatMap(x=>x.v)),mn=id=="c1"?0:Math.min(...ser.flatMap(x=>x.v))-1;
  const X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(1-(v-mn)/(mx-mn||1))*(H-T-B);
  for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;el("line",{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:"var(--line)"},s);const t=el("text",{x:L-4,y:Y(v)+4,"text-anchor":"end","font-size":10,fill:"var(--mute)"},s);t.style.fill="var(--mute)";t.textContent=Math.round(v)}
  for(let i=0;i<n;i++){const t=el("text",{x:X(i),y:H-8,"text-anchor":"middle","font-size":10},s);t.style.fill="var(--mute)";t.textContent=i?"r"+i:"start"}
  const sel=G.arm;
  [...ser].sort((a,b)=>a.ly===undefined?0:0);const ys=ser.map(x=>Y(x.v[x.v.length-1])),ord=ser.map((_,i)=>i).sort((a,b)=>ys[a]-ys[b]),lab={};let last=-99;ord.forEach(i=>{lab[i]=Math.max(ys[i],last+13);last=lab[i]});
  ser.forEach((x,i)=>{const t=el("text",{x:W-R+6,y:lab[i]+4,"font-size":11,"font-weight":x.g.arm==sel?700:400},s);t.style.fill="var(--ink)";t.textContent=SHORT[x.g.arm]||x.g.arm});
  ser.forEach(x=>{const on=x.g.arm==sel;const c=ARMC[x.g.arm]||"#888";
   el("polyline",{points:x.v.map((v,i)=>`${X(i)},${Y(v)}`).join(" "),fill:"none",stroke:c,"stroke-width":on?3:1.6,opacity:on?1:.55},s);
   x.ly=Y(x.v[x.v.length-1]);
   if(on){const cur=Math.min(Math.floor(pi/2)+(phases[pi].t=="patch"?1:0),x.v.length-1);el("circle",{cx:X(cur),cy:Y(x.v[cur]),r:5,fill:c,stroke:"var(--panel)","stroke-width":2},s)}})})}
function stop(){clearTimeout(timer);timer=null;$("play").textContent="Play"}
function tick(){const r=G.rounds[phases[pi].r],ph=phases[pi],sp=+$("sp").value;
 if(ph.t=="attack"&&si<r.seq.length){si++;draw();timer=setTimeout(tick,900*sp);return}
 if(pi<phases.length-1){pi++;si=0;draw();charts();timer=setTimeout(tick,(phases[pi].t=="patch"?1800:700)*sp)}else stop()}
$("play").onclick=()=>{if(timer){stop();return}if(pi>=phases.length-1){pi=0}si=0;$("play").textContent="Pause";draw();timer=setTimeout(tick,500)};
$("next").onclick=()=>{stop();if(phases[pi].t=="attack"&&si<G.rounds[phases[pi].r].seq.length){si++}else if(pi<phases.length-1){pi++;si=0}draw();charts()};
$("prev").onclick=()=>{stop();if(phases[pi].t=="attack"&&si>0)si--;else if(pi>0){pi--;si=phases[pi].t=="attack"?G.rounds[phases[pi].r].seq.length:0}draw();charts()};
$("sl").oninput=e=>{stop();pi=+e.target.value;si=phases[pi].t=="attack"?G.rounds[phases[pi].r].seq.length:0;draw();charts()};
$("fx").onchange=$("arm").onchange=load;load();
{const h=location.hash.slice(1).split(".");if(h[0]!==""&&h.length){if(h[2]){$("fx").value=h[2];$("arm").value=h[3];load()}pi=Math.min(+h[0],phases.length-1);si=+h[1]||0;draw();charts()}}
</script></body></html>
