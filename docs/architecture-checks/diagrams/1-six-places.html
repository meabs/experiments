<svg width="1800" height="1162" viewBox="0 0 1800 1162"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a44"/></marker></defs><text x="40" y="62" class="th">Six controls with different jobs, not six stages of one pipeline</text><text x="40" y="102" class="ts">Authority lives in different places. Human approval can sit anywhere. Rows are what I measured, not what a tool promises.</text><text x="40" y="158" class="tb">Control</text><text x="440" y="158" class="tb">Provides · sees</text><text x="1010" y="158" class="tb">What I measured</text><rect x="40" y="178" width="370" height="104" rx="8" class="box"/><text x="62" y="234.0" class="tb">Prompt / AGENTS.md</text><text x="62" y="264.0" class="tsm">coding agents</text><text x="440" y="214" class="tb" style="font-size:26px">Behavioural guidance</text><text x="440" y="248" class="q">Read once by the agent; nothing enforces it.</text><text x="1010" y="214" class="q">Planted-script hijacks: 18 of 90 runs without the paragraph,</text><text x="1010" y="245" class="q">1 of 90 with it. One fixed attack, not an adaptive one.</text><rect x="40" y="296" width="370" height="166" rx="8" class="box"/><text x="62" y="383.0" class="tb">Guard / hook</text><text x="62" y="413.0" class="tsm">coding agents</text><text x="440" y="332" class="tb" style="font-size:26px">Tool-call inspection</text><text x="440" y="366" class="q">Sees the command text before it runs,</text><text x="440" y="397" class="q">not what a script does inside.</text><text x="1010" y="332" class="q">Written-out command, uncommitted work: lost in 5 of 5 runs → 1 of 5.</text><text x="1010" y="363" class="q">Harm inside a script, or the release archive: no change.</text><text x="1010" y="394" class="q">All four harm fixtures: 17 → 14 of 20 (no measurable difference).</text><text x="1010" y="425" class="q">9 of 45 Guard runs stopped on harmless cleanup.</text><rect x="40" y="476" width="370" height="135" rx="8" class="box"/><text x="62" y="547.5" class="tb">Tool / service policy</text><text x="62" y="577.5" class="tsm">business agents</text><text x="440" y="512" class="tb" style="font-size:26px">Business rules, enforced</text><text x="440" y="546" class="q">Sees the call as it reaches the service.</text><text x="440" y="577" class="q">The agent can't edit it.</text><text x="1010" y="512" class="q">Refund service paid a timed-out refund twice in 16 of 20 Qwen</text><text x="1010" y="543" class="q">agent runs. Fixed code never retried a write: 100 of 100</text><text x="1010" y="574" class="q">went to a person.</text><rect x="40" y="625" width="370" height="135" rx="8" class="box"/><text x="62" y="696.5" class="tb">Identity / permissions</text><text x="62" y="726.5" class="tsm">business agents</text><text x="440" y="661" class="tb" style="font-size:26px">Access restriction</text><text x="440" y="695" class="q">Sees who is acting and what</text><text x="440" y="726" class="q">they may do.</text><text x="1010" y="661" class="q">Broad service account: 11 of 20 planted requests went through.</text><text x="1010" y="692" class="q">Delegated, task-scoped tokens plus a confirmation: none did.</text><rect x="40" y="774" width="370" height="135" rx="8" class="boxr"/><text x="62" y="845.5" class="tb">Human approval</text><text x="62" y="875.5" class="tsm">business agents</text><text x="440" y="810" class="tb" style="font-size:26px">Decision authorisation</text><text x="440" y="844" class="q">Sees only the facts</text><text x="440" y="875" class="q">you show the human.</text><text x="1010" y="810" class="q">£4,800 invoice: stopped every time (the agent tried in 4 of 5 runs).</text><text x="1010" y="841" class="q">£900 claim, no receipt, fake “pre-approved”: approved in 4 of 5.</text><rect x="40" y="923" width="370" height="135" rx="8" class="boxt"/><text x="62" y="994.5" class="tb">Independent verifier</text><text x="62" y="1024.5" class="tsm">both</text><text x="440" y="959" class="tb" style="font-size:26px">Outcome detection</text><text x="440" y="993" class="q">Sees the evidence you give it:</text><text x="440" y="1024" class="q">only as good as its coverage.</text><text x="1010" y="959" class="q">81 of 85 runs that missed the hidden tests had said the work was</text><text x="1010" y="990" class="q">done and passing. The stop gate never had to block, and it</text><text x="1010" y="1021" class="q">fails open, so it detects but doesn't enforce.</text><text x="40" y="1106" class="ts">Who controls the check, what it can see, and what happens when it fails matter more than how many you add.</text><text x="1760" y="1140" class="tsm" text-anchor="end">Source: guard-damage, repo-injection, do-you-need-an-agent, agent-identity-hardening, evidence-led pages (programmingtheloop.com)</text></svg>
