<svg width="1800" height="1038" viewBox="0 0 1800 1038"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a44"/></marker></defs><text x="40" y="62" class="th">Six places a check can live, and what each one can see</text><text x="40" y="102" class="ts">In the order one action meets them. Each row is what I measured, not what the tool promises.</text><text x="40" y="158" class="tb">Where</text><text x="500" y="158" class="tb">It sees</text><text x="1010" y="158" class="tb">What I measured</text><rect x="40" y="178" width="430" height="104" rx="8" class="box"/><text x="62" y="240.0" class="tb">1  Prompt rule</text><text x="500" y="214" class="q">AGENTS.md or system text</text><text x="500" y="245" class="q">(read once, then nothing enforces it)</text><text x="1010" y="214" class="q">Planted-script hijacks: 18 of 90 runs without the paragraph,</text><text x="1010" y="245" class="q">1 of 90 with it. One fixed attack, not an adaptive one.</text><rect x="40" y="296" width="430" height="166" rx="8" class="box"/><text x="62" y="389.0" class="tb">2  Guard or hook</text><text x="500" y="332" class="q">The command text, before it runs</text><text x="500" y="363" class="q">(not what a script does inside)</text><text x="1010" y="332" class="q">Uncommitted work, command written out in the docs: lost in</text><text x="1010" y="363" class="q">5 of 5 runs → 1 of 5. Harm inside a script, or the release archive:</text><text x="1010" y="394" class="q">no change. All four harm fixtures: 17 → 14 of 20 runs (no measurable</text><text x="1010" y="425" class="q">difference). 9 of 45 Guard runs were stopped on harmless cleanup.</text><rect x="40" y="476" width="430" height="104" rx="8" class="box"/><text x="62" y="538.0" class="tb">3  Limit inside the tool</text><text x="500" y="512" class="q">The call as it reaches the service</text><text x="500" y="543" class="q">(the agent can't edit this)</text><text x="1010" y="512" class="q">Refund service paid a timed-out refund twice in 16 of 20 agent runs</text><text x="1010" y="543" class="q">(Qwen). Fixed code never retried a write: 100 of 100 went to a person.</text><rect x="40" y="594" width="430" height="104" rx="8" class="box"/><text x="62" y="656.0" class="tb">4  Identity, permissions</text><text x="500" y="630" class="q">Who is acting, and what they may do</text><text x="1010" y="630" class="q">Broad service account: 11 of 20 planted requests went through.</text><text x="1010" y="661" class="q">Delegated, task-scoped tokens plus a confirmation: none did.</text><rect x="40" y="712" width="430" height="104" rx="8" class="boxr"/><text x="62" y="774.0" class="tb">5  Human approval</text><text x="500" y="748" class="q">Only the facts you show the human</text><text x="1010" y="748" class="q">£4,800 invoice: stopped every time (the agent tried in 4 of 5 runs).</text><text x="1010" y="779" class="q">£900 claim, no receipt, fake “pre-approved”: approved in 4 of 5.</text><rect x="40" y="830" width="430" height="104" rx="8" class="boxt"/><text x="62" y="892.0" class="tb">6  Verifier on the final state</text><text x="500" y="866" class="q">The result, not the route</text><text x="500" y="897" class="q">(hidden tests, hashes, git content)</text><text x="1010" y="866" class="q">Every number in these experiments came from here. 81 of 85 runs that</text><text x="1010" y="897" class="q">missed the hidden tests had said the work was done and passing.</text><text x="40" y="982" class="ts">A check is only as good as what it can see. Put it where the thing that matters is visible and the agent can’t edit it.</text><text x="1760" y="1016" class="tsm" text-anchor="end">Source: guard-damage, repo-injection, do-you-need-an-agent, agent-identity-hardening, evidence-led pages (programmingtheloop.com)</text></svg>
