<svg width="1800" height="1095" viewBox="0 0 1800 1095"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a44"/></marker></defs><text x="40" y="62" class="th">Context layers: if the agent fails because of X, add Y</text><text x="40" y="102" class="ts">Each row is a different experiment, ticket set and model setting, so read down the rows, not across them.</text><text x="40" y="158" class="tb">If the agent…</text><text x="560" y="158" class="tb">Add</text><text x="1100" y="158" class="tb">What I measured</text><rect x="40" y="178" width="470" height="102" rx="8" class="box"/><text x="62" y="214" class="t">gets a rule wrong that only</text><text x="62" y="248" class="t">your team knows</text><path d="M514 229.0 L548 229.0" class="ln"/><rect x="552" y="178" width="520" height="102" rx="8" class="boxt"/><text x="574" y="214" class="tb">A short context bundle,</text><text x="574" y="248" class="tb">or a section of AGENTS.md</text><text x="1100" y="214" class="q">1 of 10 right → 10 of 10 (bundle), 8 of 10 (AGENTS.md).</text><text x="1100" y="245" class="q">Rules already in the code: 15 of 15 with nothing added.</text><rect x="40" y="294" width="470" height="133" rx="8" class="box"/><text x="62" y="330" class="t">builds it but never checks</text><text x="62" y="364" class="t">what actually ran</text><path d="M514 360.5 L548 360.5" class="ln"/><rect x="552" y="294" width="520" height="133" rx="8" class="boxt"/><text x="574" y="330" class="tb">Six AGENTS.md lines and</text><text x="574" y="364" class="tb">three small skills</text><text x="1100" y="330" class="q">Hidden tests passed: 36% → 53% (ELC), 42.3% → 53.5%</text><text x="1100" y="361" class="q">(SDD, same setup). A 134-line AGENTS.md: 52.8%.</text><text x="1100" y="392" class="q">More text bought nothing I could measure.</text><rect x="40" y="441" width="470" height="102" rx="8" class="box"/><text x="62" y="477" class="t">needs facts from another</text><text x="62" y="511" class="t">repository</text><path d="M514 492.0 L548 492.0" class="ln"/><rect x="552" y="441" width="520" height="102" rx="8" class="boxt"/><text x="574" y="477" class="tb">A guide to that repository</text><text x="1100" y="477" class="q">1 of 24 questions right → 24 of 24 (D1).</text><text x="1100" y="508" class="q">A small local model: 4 of 20 changes → 20 of 20.</text><rect x="40" y="557" width="470" height="102" rx="8" class="box"/><text x="62" y="593" class="t">might trust a stale fact</text><text x="62" y="627" class="t">in your docs</text><path d="M514 608.0 L548 608.0" class="ln"/><rect x="552" y="557" width="520" height="102" rx="8" class="boxt"/><text x="574" y="593" class="tb">One line: check it against</text><text x="574" y="627" class="tb">the code, say what disagreed</text><text x="1100" y="593" class="q">Followed the stale fact: 8 of 24 runs → 0 of 24.</text><rect x="40" y="673" width="470" height="133" rx="8" class="box"/><text x="62" y="709" class="t">says it is done when</text><text x="62" y="743" class="t">it isn't</text><path d="M514 739.5 L548 739.5" class="ln"/><rect x="552" y="673" width="520" height="133" rx="8" class="boxt"/><text x="574" y="709" class="tb">A check outside the agent:</text><text x="574" y="743" class="tb">hidden tests, a stop hook</text><text x="1100" y="709" class="q">81 of 85 runs that missed the tests said done and passing.</text><text x="1100" y="740" class="q">Telling it to check against the running app: no</text><text x="1100" y="771" class="q">measurable difference. The stop-hook fix is untested.</text><rect x="40" y="820" width="470" height="71" rx="8" class="box"/><text x="62" y="856" class="t">is thinking too little</text><path d="M514 855.5 L548 855.5" class="ln"/><rect x="552" y="820" width="520" height="71" rx="8" class="boxt"/><text x="574" y="856" class="tb">Raise the reasoning effort</text><text x="1100" y="856" class="q">Low → medium effort: 36 → 49 of 60 passes.</text><rect x="40" y="911" width="1720" height="116" rx="8" class="boxr"/><text x="62" y="951" class="tb">Not by default</text><text x="62" y="987" class="q">Skill packs and spec toolkits: no measurable gain on hard bugs (Spec Kit −1.6 pts, OpenSpec −4.2, research-plan-implement +0.3),</text><text x="62" y="1018" class="q">Superpowers 3.07× the tokens, a heavy repository layout +35–48% tokens. In one study the agent opened the verification skill in 8 runs.</text><text x="1760" y="1073" class="tsm" text-anchor="end">Source: okf-context, evidence-led, spec-driven, d1-cross-repo-questions, okf-local, okf-stale, verify-vs-skills, skills-tasks, repo-skills pages</text></svg>
