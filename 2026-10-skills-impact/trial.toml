name = "skills-impact"

[defaults]
reps = 6
parallel = 3
timeout = 1200
baseline = "none"
claim = true

[[repos]]
name = "shopizer"
source = "/Users/garry/code/benchmark/skills-impact-work/shopizer"
ref = "6a4a0a6"

[[arms]]
name = "none"
setup = ["bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true

[[arms]]
name = "placebo"
overlay = "arms/placebo"
setup = ["bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true
uses = "careful-engineering"

[[arms]]
name = "superpowers"
overlay = "arms/superpowers"
setup = ["bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true
uses = "\\.agents/skills/[^ ]*SKILL\\.md"

[[arms]]
name = "pocock"
overlay = "arms/pocock"
setup = ["bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true
uses = "\\.agents/skills/[^ ]*SKILL\\.md"

[[arms]]
name = "pstack"
overlay = "arms/pstack"
setup = ["bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/setup.sh"]
parallel_setup = true
prompt_prefix = "/poteto-mode"
uses = "\\.cursor/(skills|agents)/"

[[agents]]
name = "codex"
model = "gpt-5.6-luna"
args = ["-c", "model_reasoning_effort=\"high\""]
edits = true
sandbox = "danger-full-access"
env = { HOME = "/Users/garry/code/benchmark/skills-impact-work/home-clean", CODEX_HOME = "/Users/garry/code/benchmark/skills-impact-work/home-clean/.codex", JAVA_HOME = "/opt/homebrew/opt/openjdk@21", PATH = "/opt/homebrew/opt/openjdk@21/bin:/Users/garry/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
isolate = ["/Users/garry/code/experiments", "/Users/garry/.agents", "/Users/garry/.claude", "/Users/garry/.cursor", "/Users/garry/.codex"]

[[agents]]
name = "cursor"
model = "grok-4.7-low"
edits = true
env = { JAVA_HOME = "/opt/homebrew/opt/openjdk@21", PATH = "/opt/homebrew/opt/openjdk@21/bin:/Users/garry/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
isolate = ["/Users/garry/code/experiments", "/Users/garry/.agents", "/Users/garry/.claude/skills", "/Users/garry/.claude/plugins", "/Users/garry/.cursor/skills", "/Users/garry/.cursor/plugins", "/Users/garry/.cursor/agents", "/Users/garry/.codex"]

[[questions]]
id = "BUG"
repo = "shopizer"
verify = "bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Bug report from a merchant: "I create my products through the admin REST API. When I give a product a special price with an end date, the storefront API never shows the discount, whether or not I also give a start date. Specials with no dates show fine."

Find the cause and fix it. When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "FEAT"
repo = "shopizer"
verify = "bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Add a limit to the storefront shopping cart REST API: a cart line may hold at most N units of a product. N is a per-store setting, read from the store's merchant configuration under the key CART_MAX_LINE_QUANTITY (a whole number); when a store has no such configuration, N is 99. A change to the setting must take effect without restarting the application.

Any request that would set a line above N units must be rejected with HTTP 400 Bad Request, and the cart must be left exactly as it was. This applies to every storefront endpoint that creates a cart or adds or changes cart items. A quantity of 0 keeps its current meaning (it removes the line).

When you have finished, reply with one short paragraph saying what you changed."""

[[questions]]
id = "CROSS"
repo = "shopizer"
verify = "bash /Users/garry/code/experiments/2026-10-skills-impact/scripts/verify.sh"
prompt = """You are working in a checkout of shopizer, a Java e-commerce platform (Maven, several modules; JDK 21 is installed and JAVA_HOME is set).

Manufacturers need an optional website. Add a field named website (a URL string) to manufacturers. It must be stored in the database, settable when a manufacturer is created or updated through the private REST API, and returned in the JSON as "website" everywhere the REST API returns a manufacturer: the manufacturer detail and list endpoints, and the manufacturer inside a product. A website that does not start with http:// or https:// must be rejected with HTTP 400 Bad Request, and nothing is stored.

When you have finished, reply with one short paragraph saying what you changed."""
