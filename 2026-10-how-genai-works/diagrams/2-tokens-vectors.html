<link rel="stylesheet" href="style.css">
<svg width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
  </defs>
  <text x="40" y="62" class="th">Steps 2 and 3: text becomes tokens, tokens become vectors</text>

  <!-- tokens -->
  <text x="40" y="140" class="tb">Tokens</text>
  <text x="40" y="180" class="ts">The prompt is cut into pieces from a fixed list of 151,936. Each piece has an id.</text>
  <g font-size="28">
    <rect x="40" y="210" width="130" height="70" rx="10" class="box"/><text x="105" y="255" class="mono" text-anchor="middle">Why</text>
    <rect x="180" y="210" width="110" height="70" rx="10" class="box"/><text x="235" y="255" class="mono" text-anchor="middle">·is</text>
    <rect x="300" y="210" width="130" height="70" rx="10" class="box"/><text x="365" y="255" class="mono" text-anchor="middle">·the</text>
    <rect x="440" y="210" width="130" height="70" rx="10" class="box"/><text x="505" y="255" class="mono" text-anchor="middle">·sky</text>
    <rect x="580" y="210" width="140" height="70" rx="10" class="box"/><text x="650" y="255" class="mono" text-anchor="middle">·blue</text>
    <rect x="730" y="210" width="80" height="70" rx="10" class="box"/><text x="770" y="255" class="mono" text-anchor="middle">?</text>
  </g>
  <text x="105" y="320" class="mono muted" text-anchor="middle">10234</text>
  <text x="235" y="320" class="mono muted" text-anchor="middle">374</text>
  <text x="365" y="320" class="mono muted" text-anchor="middle">279</text>
  <text x="505" y="320" class="mono muted" text-anchor="middle">12884</text>
  <text x="650" y="320" class="mono muted" text-anchor="middle">6303</text>
  <text x="770" y="320" class="mono muted" text-anchor="middle">30</text>
  <text x="40" y="390" class="ts">· marks a space. Long or rare words get split:</text>
  <rect x="40" y="410" width="200" height="70" rx="10" class="box"/><text x="140" y="455" class="mono" text-anchor="middle">·unbelie</text>
  <rect x="250" y="410" width="150" height="70" rx="10" class="box"/><text x="325" y="455" class="mono" text-anchor="middle">vably</text>

  <!-- vectors -->
  <text x="40" y="580" class="tb">Vectors</text>
  <text x="40" y="620" class="ts">Each id picks a row of 1,024 numbers. The model learned these in training.</text>
  <rect x="40" y="650" width="800" height="90" rx="12" class="boxt"/>
  <text x="70" y="706" class="mono">·cat → [-0.003, -0.053, -0.015, 0.013, …]</text>
  <text x="40" y="800" class="ts">As the layers work on them, words used in similar ways end up</text>
  <text x="40" y="836" class="ts">pointing in similar directions. That's what "meaning" is, to the model.</text>

  <!-- similarity -->
  <rect x="930" y="130" width="830" height="820" rx="18" class="box"/>
  <text x="1345" y="190" class="tb" text-anchor="middle">How close is each word to "cat"?</text>
  <text x="1345" y="228" class="ts" text-anchor="middle">cosine similarity, middle layer (14 of 28), 20 words</text>
  <line x1="1320" y1="270" x2="1320" y2="860" stroke="#1d2a44" stroke-width="2"/>
  <text x="1080" y="322" class="t" text-anchor="end">kitten</text><rect x="1320" y="290" width="308" height="44" fill="#1f6f8b"/>
  <text x="1640" y="322" class="t">0.55</text>
  <text x="1080" y="402" class="t" text-anchor="end">dog</text><rect x="1320" y="370" width="235" height="44" fill="#1f6f8b"/>
  <text x="1567" y="402" class="t">0.42</text>
  <text x="1080" y="482" class="t" text-anchor="end">mouse</text><rect x="1320" y="450" width="134" height="44" fill="#1f6f8b"/>
  <text x="1466" y="482" class="t">0.24</text>
  <text x="1080" y="562" class="t" text-anchor="end">car</text><rect x="1320" y="530" width="78" height="44" fill="#b9b2a0"/>
  <text x="1410" y="562" class="t">0.14</text>
  <text x="1080" y="642" class="t" text-anchor="end">lemon</text><rect x="1169" y="610" width="151" height="44" fill="#b4532a"/>
  <text x="1332" y="642" class="t">−0.27</text>
  <text x="1080" y="722" class="t" text-anchor="end">orange</text><rect x="1158" y="690" width="162" height="44" fill="#b4532a"/>
  <text x="1332" y="722" class="t">−0.29</text>
  <text x="1080" y="802" class="t" text-anchor="end">yellow</text><rect x="1146" y="770" width="174" height="44" fill="#b4532a"/>
  <text x="1332" y="802" class="t">−0.31</text>
  <text x="1345" y="920" class="ts" text-anchor="middle">animals close, fruit and colours far (1 is the same direction)</text>
</svg>
