<link rel="stylesheet" href="style.css">
<svg width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
  </defs>
  <text x="40" y="62" class="th">What happens when you press Enter</text>
  <text x="40" y="104" class="ts">Measured on Qwen3-0.6B-Base, a small open model with 28 layers, run on my own machine.</text>

  <!-- row 1 -->
  <rect x="40" y="160" width="360" height="190" rx="16" class="box"/>
  <text x="220" y="210" class="tb" text-anchor="middle">1. Your prompt</text>
  <text x="220" y="262" class="mono" text-anchor="middle">"Why is the sky blue?"</text>
  <text x="220" y="310" class="ts" text-anchor="middle">just text</text>
  <path d="M400 255 H 470" class="ln"/>

  <rect x="475" y="160" width="400" height="190" rx="16" class="box"/>
  <text x="675" y="210" class="tb" text-anchor="middle">2. Tokens</text>
  <text x="675" y="262" class="mono" text-anchor="middle">Why|·is|·the|·sky|·blue|?</text>
  <text x="675" y="310" class="ts" text-anchor="middle">6 pieces, each a number (id)</text>
  <path d="M875 255 H 945" class="ln"/>

  <rect x="950" y="160" width="380" height="190" rx="16" class="box"/>
  <text x="1140" y="210" class="tb" text-anchor="middle">3. Vectors</text>
  <text x="1140" y="262" class="mono" text-anchor="middle">[-0.003, -0.053, …]</text>
  <text x="1140" y="310" class="ts" text-anchor="middle">1,024 numbers per token</text>
  <path d="M1330 255 H 1400" class="ln"/>

  <rect x="1405" y="140" width="355" height="420" rx="18" class="boxn"/>
  <text x="1582" y="200" class="tw" text-anchor="middle">4. Transformer</text>
  <text x="1582" y="250" fill="#e3eff3" font-size="25" text-anchor="middle">28 layers, one after</text>
  <text x="1582" y="282" fill="#e3eff3" font-size="25" text-anchor="middle">another; each one has</text>
  <rect x="1440" y="315" width="285" height="80" rx="12" fill="#e3eff3"/>
  <text x="1582" y="350" class="t" text-anchor="middle" font-size="26">attention</text>
  <text x="1582" y="380" class="ts" text-anchor="middle" style="font-size:19px">which words matter here?</text>
  <rect x="1440" y="410" width="285" height="80" rx="12" fill="#e3eff3"/>
  <text x="1582" y="445" class="t" text-anchor="middle" font-size="26">feed-forward</text>
  <text x="1582" y="475" class="ts" text-anchor="middle" style="font-size:19px">what it has learned</text>
  <text x="1582" y="532" fill="#e3eff3" font-size="23" text-anchor="middle">vectors in, better vectors out</text>
  <path d="M1582 560 V 640" class="ln"/>

  <!-- row 2, right to left -->
  <rect x="1305" y="645" width="455" height="200" rx="16" class="boxt"/>
  <text x="1532" y="695" class="tb" text-anchor="middle">5. Next-token odds</text>
  <text x="1532" y="755" class="ts" text-anchor="middle">a probability for every one</text>
  <text x="1532" y="795" class="ts" text-anchor="middle">of its 151,936 tokens</text>
    <path d="M1305 745 H 1225" class="ln"/>

  <rect x="855" y="645" width="365" height="200" rx="16" class="boxt"/>
  <text x="1037" y="695" class="tb" text-anchor="middle">6. Pick one</text>
  <text x="1037" y="745" class="ts" text-anchor="middle">the top one, or a</text>
  <text x="1037" y="780" class="ts" text-anchor="middle">weighted dice roll</text>
  <text x="1037" y="818" class="ts" text-anchor="middle">(temperature)</text>
  <path d="M855 745 H 775" class="ln"/>

  <rect x="405" y="645" width="365" height="200" rx="16" class="boxt"/>
  <text x="587" y="695" class="tb" text-anchor="middle">7. Add it on</text>
  <text x="587" y="745" class="ts" text-anchor="middle">the new token joins</text>
  <text x="587" y="780" class="ts" text-anchor="middle">the text, and it all</text>
  <text x="587" y="818" class="ts" text-anchor="middle">goes round again</text>
  <path d="M587 645 C 587 560, 675 480, 675 352" class="lnt"/>
  <text x="700" y="500" class="teal" font-size="26" font-weight="650">loop, one token</text>
  <text x="700" y="534" class="teal" font-size="26" font-weight="650">at a time</text>
  <path d="M405 745 H 325" class="ln"/>

  <rect x="40" y="645" width="280" height="200" rx="16" class="box"/>
  <text x="180" y="695" class="tb" text-anchor="middle">8. Reply</text>
  <text x="180" y="745" class="ts" text-anchor="middle">at a stop token,</text>
  <text x="180" y="780" class="ts" text-anchor="middle">ids turn back</text>
  <text x="180" y="818" class="ts" text-anchor="middle">into text</text>

  <text x="40" y="930" class="t">Nothing in this loop looks facts up. Every word of the reply is step 5 and step 6, again and again.</text>
  <text x="40" y="980" class="ts">A chat model works the same way; extra training makes the likeliest next tokens look like a helpful answer.</text>
</svg>
