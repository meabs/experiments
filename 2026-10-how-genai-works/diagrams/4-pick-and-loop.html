<link rel="stylesheet" href="style.css">
<svg width="1800" height="1000" viewBox="0 0 1800 1000">
  <text x="40" y="62" class="th">Steps 5 to 7: odds, a pick, and round again</text>

  <!-- odds -->
  <rect x="40" y="110" width="840" height="400" rx="18" class="box"/>
  <text x="70" y="165" class="tb">"The cat sat on the …"</text>
  <text x="70" y="203" class="ts">next-token odds, top 3 (higher means more likely)</text>
  <text x="70" y="260" class="t">small model (0.6B)</text>
  <text x="110" y="305" class="mono">·chair 6%   ·edge 5%   ·window 4%</text>
  <text x="110" y="345" class="mono muted">(·mat: 3%, fifth)</text>
  <text x="70" y="410" class="t">27B model</text>
  <text x="110" y="455" class="mono">·mat 84%   ·______ 2%   ·table 1%</text>

  <!-- temperature -->
  <rect x="920" y="110" width="840" height="400" rx="18" class="boxt"/>
  <text x="950" y="165" class="tb">"My favourite colour is …", 20 tries</text>
  <text x="950" y="203" class="ts">temperature: how much the dice roll favours the top choice</text>
  <text x="950" y="265" class="t">0     →  blue ×20</text>
  <text x="1735" y="265" class="t" text-anchor="end">1 different</text>
  <text x="950" y="335" class="t">0.7  →  blue, green, black, the, …</text>
  <text x="1500" y="335" class="t" text-anchor="end"></text>
  <text x="1735" y="335" class="t" text-anchor="end">7 different</text>
  <text x="950" y="405" class="t">1.5  →  Guinness, liver, vinegar, …</text>
  <text x="1735" y="405" class="t" text-anchor="end">17 different</text>
  <text x="1735" y="265" class="t" text-anchor="end"> </text>
  <text x="950" y="470" class="ts">Same model, same prompt. Only the dice changed.</text>

  <!-- loop -->
  <rect x="40" y="550" width="1720" height="400" rx="18" class="box"/>
  <text x="70" y="605" class="tb">The loop: "The sky is blue because …", one token at a time (top choice each time)</text>
  <g font-size="26">
    <text x="70" y="680" class="mono">·the</text><text x="70" y="720" class="mono muted">20%</text>
    <text x="220" y="680" class="mono">·molecules</text><text x="220" y="720" class="mono muted">28%</text>
    <text x="440" y="680" class="mono">·in</text><text x="440" y="720" class="mono muted">63%</text>
    <text x="540" y="680" class="mono">·the</text><text x="540" y="720" class="mono muted">93%</text>
    <text x="680" y="680" class="mono">·air</text><text x="680" y="720" class="mono muted">72%</text>
    <text x="810" y="680" class="mono">·are</text><text x="810" y="720" class="mono muted">28%</text>
    <text x="950" y="680" class="mono red">·______</text><text x="950" y="720" class="mono muted">9%</text>
    <text x="1130" y="680" class="mono red">__</text><text x="1130" y="720" class="mono muted">26%</text>
    <text x="1230" y="680" class="mono red">.\n</text><text x="1230" y="720" class="mono muted">27%</text>
    <text x="1350" y="680" class="mono red">Answer</text><text x="1350" y="720" class="mono muted">83%</text>
  </g>
  <text x="70" y="800" class="t">It started a sensible answer, then turned it into a quiz sheet: "…the air are ________. Answer".</text>
  <text x="70" y="850" class="ts">This base model only continues text the way its training text tends to go, and quiz sheets are common.</text>
  <text x="70" y="890" class="ts">Chat models get extra training so that the likeliest continuation is a helpful reply.</text>
</svg>
