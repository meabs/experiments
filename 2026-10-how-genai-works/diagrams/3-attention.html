<link rel="stylesheet" href="style.css">
<svg width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
  </defs>
  <text x="40" y="62" class="th">Step 4: inside the transformer, attention</text>
  <text x="40" y="104" class="ts">Each token's vector gets updated by looking back at the earlier tokens. Each "head" decides how much to look at each one.</text>

  <!-- sentence -->
  <g>
    <rect x="40" y="420" width="110" height="64" rx="10" class="box"/><text x="95" y="462" class="mono" text-anchor="middle">The</text>
    <rect x="160" y="420" width="150" height="64" rx="10" class="boxt"/><text x="235" y="462" class="mono" text-anchor="middle">animal</text>
    <rect x="320" y="420" width="120" height="64" rx="10" class="box"/><text x="380" y="462" class="mono" text-anchor="middle">didn</text>
    <rect x="450" y="420" width="70" height="64" rx="10" class="box"/><text x="485" y="462" class="mono" text-anchor="middle">'t</text>
    <rect x="530" y="420" width="130" height="64" rx="10" class="box"/><text x="595" y="462" class="mono" text-anchor="middle">cross</text>
    <rect x="670" y="420" width="100" height="64" rx="10" class="box"/><text x="720" y="462" class="mono" text-anchor="middle">the</text>
    <rect x="780" y="420" width="150" height="64" rx="10" class="boxt"/><text x="855" y="462" class="mono" text-anchor="middle">street</text>
    <rect x="940" y="420" width="170" height="64" rx="10" class="boxt"/><text x="1025" y="462" class="mono" text-anchor="middle">because</text>
    <rect x="1120" y="420" width="80" height="64" rx="10" class="boxn"/><text x="1160" y="462" class="mono" fill="#fff" text-anchor="middle" style="fill:#fff">it</text>
    <rect x="1210" y="420" width="90" height="64" rx="10" class="box" opacity="0.4"/><text x="1255" y="462" class="mono muted" text-anchor="middle" opacity="0.5">was</text>
    <rect x="1310" y="420" width="90" height="64" rx="10" class="box" opacity="0.4"/><text x="1355" y="462" class="mono muted" text-anchor="middle" opacity="0.5">too</text>
    <rect x="1410" y="420" width="120" height="64" rx="10" class="box" opacity="0.4"/><text x="1470" y="462" class="mono muted" text-anchor="middle" opacity="0.5">tired</text>
  </g>
  <!-- arcs from "it" -->
  <path d="M1160 420 C 1140 230, 1050 230, 1025 418" class="lnt" stroke-width="9"/>
  <path d="M1160 420 C 1140 170, 880 170, 855 418" class="lnt" stroke-width="5"/>
  <path d="M1160 420 C 1140 110, 260 110, 235 418" class="lnt" stroke-width="4"/>
  <text x="1094" y="262" class="tb" text-anchor="middle">206</text>
  <text x="1009" y="218" class="tb" text-anchor="middle">53</text>
  <text x="699" y="173" class="tb" text-anchor="middle">42</text>
  <text x="1300" y="250" class="ts">heads whose strongest look,</text>
  <text x="1300" y="284" class="ts">from "it", lands on that word</text>
  <text x="1300" y="318" class="ts">(of 448 = 28 layers × 16 heads)</text>
  <text x="1300" y="380" class="ts">Later words are hidden from "it":</text>
  <text x="1300" y="414" class="ts">a model only looks back.</text>

  <!-- explanation -->
  <rect x="40" y="560" width="840" height="380" rx="18" class="box"/>
  <text x="70" y="615" class="tb">What a head does</text>
  <text x="70" y="665" class="t">1. Scores how relevant each earlier token is</text>
  <text x="70" y="710" class="t">2. Turns the scores into shares that add up to 1</text>
  <text x="70" y="755" class="t">3. Mixes those tokens' vectors into "it"</text>
  <text x="70" y="820" class="ts">Then a feed-forward step works on each vector on its own.</text>
  <text x="70" y="856" class="ts">That's one layer. This model has 28, one after another,</text>
  <text x="70" y="892" class="ts">and the same weights for every prompt.</text>

  <rect x="920" y="560" width="840" height="380" rx="18" class="boxt"/>
  <text x="950" y="615" class="tb">What I didn't expect</text>
  <text x="950" y="665" class="t">The textbook picture is "it" looking at "animal".</text>
  <text x="950" y="710" class="t">Here only 42 of 448 heads did that most.</text>
  <text x="950" y="755" class="t">206 looked hardest at "because".</text>
  <text x="950" y="820" class="ts">Different heads pick out different words, and only a</text>
  <text x="950" y="856" class="ts">few link "it" to "animal". The meaning is spread across</text>
  <text x="950" y="892" class="ts">many heads and layers, not held by any one of them.</text>
</svg>
