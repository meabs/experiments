<text x="68" y="346" class="t">builds, tests, stops</text>

<text x="648" y="346" class="t">Agent commits, pushes,</text>
<text x="648" y="388" class="t">opens a pull request</text>
<text x="648" y="430" class="t">Delivers: a PR</text>
<text x="648" y="472" class="t">No separate review</text>
<rect x="1200" y="140" width="560" height="380" rx="16" fill="#fff" stroke="#d0731f" stroke-width="5"/><rect x="1200" y="140" width="560" height="70" rx="16" fill="#d0731f"/><rect x="1200" y="190" width="560" height="20" fill="#d0731f"/><text x="1228" y="188" class="tw">C  Machinist, standard pipeline</text>
