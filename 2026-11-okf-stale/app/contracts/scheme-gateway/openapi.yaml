# Payment scheme gateway API. Owned by the payments platform team; vendored here, do not edit.
openapi: 3.0.3
info:
  title: Payment scheme gateway
  version: "2.4.0"
  description: |
    Published 2026-08-20.

    Instruction references are idempotency keys: a reference is unique for 30 days. Submitting a reference the
    gateway already holds is rejected with reasonCode DUPL and does not create a second payment; resending the same
    reference is therefore safe, and sending the same payment under a new reference pays it twice.

    The gateway answers within 10 seconds. A client timeout does not mean the instruction was refused: it may have
    been accepted. Use GET /v2/instructions/{reference} to find out, or resubmit under the same reference.

    Same-day instructions after 15:30 UK time, and instructions dated on a non-working day, are rejected with DT01.

    Changes in 2.4.0: references became idempotency keys (DUPL) and the status query was added. Before 2.4.0 a
    timed-out instruction was always discarded and had to be resent under a new reference.
paths:
  /v2/instructions:
    post:
      summary: Submit a payment instruction
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Instruction'}
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        "422":
          description: Rejected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rejection'}
  /v2/instructions/{reference}:
    get:
      summary: Status query - the instruction held under this reference
      parameters:
        - {name: reference, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The gateway holds an instruction with this reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        "404":
          description: No instruction with this reference in the last 30 days
components:
  schemas:
    Instruction:
      type: object
      required: [reference, amount, payeeSortCode, payeeAccountNumber, payeeName, executionDate]
      properties:
        reference: {type: string, description: "Unique for 30 days (idempotency key)"}
        amount: {type: number}
        payeeSortCode: {type: string}
        payeeAccountNumber: {type: string}
        payeeName: {type: string}
        executionDate: {type: string, format: date}
    Receipt:
      type: object
      properties:
        instructionId: {type: string}
    Rejection:
      type: object
      properties:
        reasonCode:
          type: string
          enum: [AC01, AC04, DT01, DUPL, RR04]
          description: "AC01 wrong account number, AC04 payee account closed, DT01 invalid date, DUPL duplicate reference, RR04 regulatory (sanctions)"
