# Customer notification templates. Owned by the communications team; vendored here, do not edit.
# Contract version 3.2, published 2026-09-14.
service: notification-service
version: "3.2"
published: "2026-09-14"
endpoint: POST /v1/messages   # body: {"userId", "template", "params"}
rules:
  - Never include a full account number or sort code in params; use accountEnding (last four digits).
  - Unknown template names are rejected by the service with 422 and the message is not sent.
templates:
  PAYMENT_SENT:
    description: A payment has been sent to the payee.
    params: [amount, payee, accountEnding]
  PAYMENT_QUEUED:
    description: A payment has been accepted and will be sent on a later working day.
    params: [amount, payee, accountEnding, executionDate]
  PAYMENT_UNDER_REVIEW:
    description: A payment is being held for a fraud review.
    params: [amount, payee, accountEnding]
  PAYMENT_FAILED:
    description: A payment could not be made (refused by the scheme or by the bank).
    params: [amount, payee, accountEnding, reason]
changes:
  - version: "3.2"
    date: "2026-09-14"
    note: PAYMENT_DECLINED renamed to PAYMENT_FAILED; PAYMENT_DECLINED is no longer accepted.
  - version: "3.1"
    date: "2026-03-02"
    note: PAYMENT_UNDER_REVIEW added.
