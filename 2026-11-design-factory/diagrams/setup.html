<svg width="1800" height="880" viewBox="0 0 1800 880"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a44"/></marker></defs><text x="40" y="62" class="th">Same agent, same brief, same web search. One has the factory, one has nothing.</text><text x="40" y="102" class="ts">Codex with gpt-5.6-luna at medium effort, six banking briefs, 5 repeats each: 60 runs, 30 pairs. Both are told to research, then storyboard.</text><rect x="40" y="150" width="520" height="360" rx="10" class="box"/><text x="60" y="188" class="tb">A  Plain agent</text><text x="60" y="226" class="t">The workspace holds only</text><text x="60" y="260" class="t">a README.</text><text x="60" y="294" class="t"></text><text x="60" y="328" class="t">It gets the brief, the delivery</text><text x="60" y="362" class="t">contract and live web search,</text><text x="60" y="396" class="t">and uses its own knowledge.</text><rect x="620" y="150" width="1140" height="360" rx="10" class="boxt"/><text x="640" y="188" class="tb">B  Design Factory</text><text x="650" y="239" class="tb">AGENTS.md</text><text x="650" y="267" class="t">points to the index</text><text x="650" y="309" class="tb">okf/index.md</text><text x="650" y="337" class="t">lists everything below</text><text x="650" y="379" class="tb">okf/workflow.md</text><text x="650" y="407" class="t">six stages, review mandatory</text><text x="650" y="449" class="tb">12 skills</text><text x="650" y="477" class="t">research, storyboard, build, critique,</text><text x="1210" y="239" class="t">accessibility, legal, banking, Impeccable</text><text x="1210" y="309" class="tb">rules and knowledge</text><text x="1210" y="337" class="t">house rules, design, accessibility, UK law</text><text x="1210" y="379" class="tb">banking pack</text><text x="1210" y="407" class="t">payments, savings, borrowing, cards</text><text x="1210" y="449" class="tb">tools</text><text x="1210" y="477" class="t">contrast, lint, headless render check</text><text x="40" y="570" class="tb">Both arms deliver the same three things</text><text x="40" y="612" class="t">research.md ending in numbered design decisions · storyboard/index.html with every screen addressable · storyboard/screens.json</text><text x="40" y="680" class="tb">Judged blind, side by side, on screenshots</text><text x="40" y="722" class="t">Two vision models from other providers, both orders, two views (first six screens; whole design), seven criteria.</text><text x="40" y="768" class="t">Also measured without a model: brief checklist (12 items), axe-core accessibility violations, target sizes, cost.</text><text x="40" y="814" class="t">Plain run i is paired with factory run i of the same brief; tests are sign-flip permutation tests on the 30 pairs.</text><text x="40" y="858" class="tsm">Source: github.com/meabs/experiments, 2026-11-design-factory</text></svg>
