<link rel="stylesheet" href="style.css">
<svg width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
  </defs>
  <text x="40" y="62" class="th">Four ways to answer the same email</text>
  <text x="40" y="104" class="ts">Beige: code I wrote decides. Teal: the model decides. All four use the same tools and the same policy.</text>

  <!-- column headers -->
  <text x="40"  y="170" class="tb">1. Plain code</text>
  <text x="40"  y="204" class="ts">204 lines, 0 model calls</text>
  <text x="480" y="170" class="tb">2. One model call</text>
  <text x="480" y="204" class="ts">53 lines, 1 call</text>
  <text x="920" y="170" class="tb">3. Workflow</text>
  <text x="920" y="204" class="ts">165 lines, 1 or 2 calls</text>
  <text x="1360" y="170" class="tb">4. Agent</text>
  <text x="1360" y="204" class="ts">34 lines, up to 15 calls</text>

  <!-- 1 plain code -->
  <rect x="40" y="240" width="380" height="110" rx="16" class="box"/>
  <text x="230" y="290" class="t" text-anchor="middle">Keyword rules</text>
  <text x="230" y="326" class="ts" text-anchor="middle">which of 4 request types?</text>
  <path d="M230 350 V 398" class="ln"/>
  <rect x="40" y="400" width="380" height="110" rx="16" class="box"/>
  <text x="230" y="450" class="t" text-anchor="middle">Fixed steps per type</text>
  <text x="230" y="486" class="ts" text-anchor="middle">look up, check policy, act</text>
  <path d="M230 510 V 558" class="ln"/>
  <rect x="40" y="560" width="380" height="110" rx="16" class="box"/>
  <text x="230" y="610" class="t" text-anchor="middle">Template reply</text>
  <text x="230" y="646" class="ts" text-anchor="middle">anything else: a person</text>

  <!-- 2 one call -->
  <rect x="480" y="240" width="380" height="110" rx="16" class="box"/>
  <text x="670" y="290" class="t" text-anchor="middle">Fetch everything</text>
  <text x="670" y="326" class="ts" text-anchor="middle">customer, all orders, stock</text>
  <path d="M670 350 V 398" class="ln"/>
  <rect x="480" y="400" width="380" height="110" rx="16" class="boxt"/>
  <text x="670" y="450" class="t" text-anchor="middle">One model call</text>
  <text x="670" y="486" class="ts" text-anchor="middle">decides actions + writes reply</text>
  <path d="M670 510 V 558" class="ln"/>
  <rect x="480" y="560" width="380" height="110" rx="16" class="box"/>
  <text x="670" y="610" class="t" text-anchor="middle">Carry out the actions</text>
  <text x="670" y="646" class="ts" text-anchor="middle">one fails: a person</text>

  <!-- 3 workflow -->
  <rect x="920" y="240" width="380" height="110" rx="16" class="boxt"/>
  <text x="1110" y="290" class="t" text-anchor="middle">Model reads the email</text>
  <text x="1110" y="326" class="ts" text-anchor="middle">into fixed fields</text>
  <path d="M1110 350 V 398" class="ln"/>
  <rect x="920" y="400" width="380" height="110" rx="16" class="box"/>
  <text x="1110" y="450" class="t" text-anchor="middle">Fixed steps per type</text>
  <text x="1110" y="486" class="ts" text-anchor="middle">same code as plain code</text>
  <path d="M1110 510 V 558" class="ln"/>
  <rect x="920" y="560" width="380" height="110" rx="16" class="boxt"/>
  <text x="1110" y="610" class="t" text-anchor="middle">Model writes the reply</text>
  <text x="1110" y="646" class="ts" text-anchor="middle">anything else: a person</text>

  <!-- 4 agent -->
  <rect x="1360" y="240" width="400" height="430" rx="16" class="boxt"/>
  <text x="1560" y="300" class="t" text-anchor="middle">Model in a loop</text>
  <text x="1560" y="350" class="ts" text-anchor="middle">picks a tool</text>
  <text x="1560" y="385" class="ts" text-anchor="middle">reads the result</text>
  <text x="1560" y="420" class="ts" text-anchor="middle">picks the next one</text>
  <text x="1560" y="455" class="ts" text-anchor="middle">…</text>
  <text x="1560" y="490" class="ts" text-anchor="middle">writes the reply</text>
  <path d="M1690 380 C 1740 380, 1740 480, 1690 480" class="lnt"/>
  <text x="1560" y="600" class="ts" text-anchor="middle">at 15 steps: a person</text>

  <!-- tools strip -->
  <rect x="40" y="740" width="1720" height="200" rx="18" class="boxn"/>
  <text x="900" y="800" class="tw" text-anchor="middle">The shop's 9 tools (simulated, with failures injected in some cases)</text>
  <text x="900" y="850" fill="#e3eff3" font-size="25" text-anchor="middle">find_customer · get_order · track_shipment · check_stock · issue_refund · send_replacement</text>
  <text x="900" y="890" fill="#e3eff3" font-size="25" text-anchor="middle">change_address · cancel_order · escalate (hand to a person)</text>
</svg>
