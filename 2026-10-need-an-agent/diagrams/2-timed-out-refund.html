<link rel="stylesheet" href="style.css">
<svg width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4532a"/></marker>
  </defs>
  <text x="40" y="62" class="th">The refund that timed out after it went through</text>
  <text x="40" y="104" class="ts">Case L4-03: "please refund the two mugs". The payment service takes the money back, then times out before saying so.</text>

  <!-- the call -->
  <rect x="40" y="160" width="420" height="150" rx="16" class="box"/>
  <text x="250" y="215" class="tb" text-anchor="middle">issue_refund(£24)</text>
  <text x="250" y="258" class="ts" text-anchor="middle">refund made at the payment</text>
  <text x="250" y="290" class="ts" text-anchor="middle">provider…</text>
  <path d="M460 235 H 560" class="ln"/>
  <rect x="565" y="160" width="420" height="150" rx="16" class="boxr"/>
  <text x="775" y="215" class="tb" text-anchor="middle">504 timeout</text>
  <text x="775" y="258" class="ts" text-anchor="middle">…but the caller only sees</text>
  <text x="775" y="290" class="ts" text-anchor="middle">an error</text>
  <path d="M985 235 H 1085" class="ln"/>
  <rect x="1090" y="160" width="670" height="150" rx="16" class="boxn"/>
  <text x="1425" y="215" class="tw" text-anchor="middle">What happens next?</text>
  <text x="1425" y="262" fill="#e3eff3" font-size="25" text-anchor="middle">the refund service doesn't reject a duplicate,</text>
  <text x="1425" y="294" fill="#e3eff3" font-size="25" text-anchor="middle">like many real payment integrations</text>

  <!-- three outcomes -->
  <rect x="40" y="380" width="540" height="430" rx="18" class="box"/>
  <text x="310" y="440" class="tb" text-anchor="middle">Plain code, one call, workflow</text>
  <text x="310" y="500" class="t" text-anchor="middle">Never retry a write.</text>
  <text x="310" y="540" class="t" text-anchor="middle">Hand it to a person.</text>
  <text x="310" y="630" class="th" text-anchor="middle">100 of 100</text>
  <text x="310" y="675" class="ts" text-anchor="middle">escalated</text>
  <text x="310" y="760" class="ts" text-anchor="middle">safe, but someone has to check</text>

  <rect x="630" y="380" width="540" height="430" rx="18" class="boxt"/>
  <text x="900" y="440" class="tb" text-anchor="middle">Agent, Luna</text>
  <text x="900" y="500" class="t" text-anchor="middle">"I couldn't confirm the refund,</text>
  <text x="900" y="540" class="t" text-anchor="middle">so I've asked billing to check."</text>
  <text x="900" y="630" class="th" text-anchor="middle">15 escalated, 5 resolved</text>
  <text x="900" y="675" class="ts" text-anchor="middle">of 20; never refunded twice</text>
  <text x="900" y="760" class="ts" text-anchor="middle">cautious, like the fixed code</text>

  <rect x="1220" y="380" width="540" height="430" rx="18" class="boxr"/>
  <text x="1490" y="440" class="tb" text-anchor="middle">Agent, Qwen</text>
  <text x="1490" y="500" class="t" text-anchor="middle">Tries again. It works.</text>
  <text x="1490" y="540" class="t" text-anchor="middle">"I've processed your refund."</text>
  <text x="1490" y="630" class="th red" text-anchor="middle">16 of 20</text>
  <text x="1490" y="675" class="ts" text-anchor="middle">refunded twice</text>
  <text x="1490" y="760" class="ts" text-anchor="middle">the same habit fixed the warehouse failure</text>
</svg>
