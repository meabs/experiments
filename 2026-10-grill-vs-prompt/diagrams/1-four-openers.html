<link rel="stylesheet" href="style.css">
<svg width="1800" height="1150" viewBox="0 0 1800 1150">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker></defs>
  <text x="40" y="62" class="th">Four ways to start the agent on the same ticket</text>
  <text x="40" y="102" class="ts">Each run: the ticket, plus one opener. Codex CLI with gpt-5.6-luna; the developer answers in the same session.</text>

  <rect x="40" y="140" width="400" height="330" rx="16" class="box"/>
  <text x="65" y="190" class="tb">T  Ticket only</text>
  <text x="65" y="240" class="q">Nothing added. Nobody to ask:</text>
  <text x="65" y="272" class="q">the agent builds straight away.</text>

  <rect x="470" y="140" width="400" height="330" rx="16" class="boxt"/>
  <text x="495" y="190" class="tb">G  Grilling skill</text>
  <text x="495" y="240" class="q">"Grill me on this before you</text>
  <text x="495" y="272" class="q">build it." with Matt Pocock's</text>
  <text x="495" y="304" class="q">grilling skill installed.</text>
  <text x="495" y="368" class="tsm">Walks the design tree one branch</text>
  <text x="495" y="398" class="tsm">at a time, round after round, with</text>
  <text x="495" y="428" class="tsm">a recommended answer to each.</text>

  <rect x="900" y="140" width="400" height="330" rx="16" class="boxg"/>
  <text x="925" y="190" class="tb">S  Structured prompt</text>
  <text x="925" y="240" class="q">"Before writing any code, list every</text>
  <text x="925" y="272" class="q">decision this ticket leaves open</text>
  <text x="925" y="304" class="q">that you can't settle from the</text>
  <text x="925" y="336" class="q">code, each with your recommended</text>
  <text x="925" y="368" class="q">answer. Then stop and wait for</text>
  <text x="925" y="400" class="q">my reply."</text>
  <text x="925" y="440" class="tsm">No skill. One list, one reply.</text>

  <rect x="1330" y="140" width="430" height="330" rx="16" class="boxr"/>
  <text x="1355" y="190" class="tb">K  Three questions</text>
  <text x="1355" y="240" class="q">"Before writing any code, ask me at</text>
  <text x="1355" y="272" class="q">most three questions: the ones whose</text>
  <text x="1355" y="304" class="q">answers would change the code most.</text>
  <text x="1355" y="336" class="q">Then stop and wait for my reply."</text>
  <text x="1355" y="410" class="tsm">It asked open questions, without</text>
  <text x="1355" y="440" class="tsm">recommended answers.</text>

  <!-- stats -->
  <g class="ts">
    <text x="40" y="530">Per run (ranges across the ticket types)</text>
  </g>
  <g class="t">
    <text x="40"  y="585" class="ts">Rounds</text>
    <text text-anchor="middle" x="300" y="585">0</text><text x="680" y="585" text-anchor="middle">2.4–2.6</text><text x="1100" y="585" text-anchor="middle">1.0–1.2</text><text x="1545" y="585" text-anchor="middle">1</text>
    <text x="40"  y="635" class="ts">Questions</text>
    <text text-anchor="middle" x="300" y="635">0</text><text x="680" y="635" text-anchor="middle">10–13</text><text x="1100" y="635" text-anchor="middle">8–10</text><text x="1545" y="635" text-anchor="middle">3</text>
    <text x="40"  y="685" class="ts">Words to read</text>
    <text text-anchor="middle" x="300" y="685">0</text><text x="680" y="685" text-anchor="middle">599–718</text><text x="1100" y="685" text-anchor="middle">266–351</text><text x="1545" y="685" text-anchor="middle">70–101</text>
    <text x="40"  y="745" class="ts" font-weight="650">Rules met, of 75</text>
    <text text-anchor="middle" x="300" y="745" font-weight="700" class="red">0</text><text x="680" y="745" text-anchor="middle" font-weight="700" class="teal">34</text><text x="1100" y="745" text-anchor="middle" font-weight="700" class="green">35</text><text x="1545" y="745" text-anchor="middle" font-weight="700">25</text>
  </g>
  <line x1="40" y1="710" x2="1760" y2="710" stroke="#b9b2a0" stroke-width="2"/>

  <!-- example -->
  <text x="40" y="830" class="tb">Where the rules came from: a corrected recommendation</text>
  <rect x="40" y="860" width="840" height="220" rx="14" class="boxg"/>
  <text x="65" y="900" class="tsm">S run, goodwill-credit ticket, item 4 of 13 in the agent's list</text>
  <text x="65" y="945" class="mono">4. How should amount scale be handled?</text>
  <text x="65" y="980" class="mono">   Recommendation: accept any positive</text>
  <text x="65" y="1015" class="mono">   amount with scale 0–2 … and add no</text>
  <text x="65" y="1050" class="mono">   unspecified maximum.</text>
  <path d="M880 970 H 935" class="ln"/>
  <rect x="940" y="860" width="820" height="220" rx="14" class="box"/>
  <text x="965" y="900" class="tsm">Developer (Claude following a fixed brief)</text>
  <text x="965" y="945" class="mono">1. Yes.  2. Yes.  3. Yes.</text>
  <text x="965" y="980" class="mono">4. Yes on the decimals. No maximum, but</text>
  <text x="965" y="1015" class="mono">   anything over £100 needs approving</text>
  <text x="965" y="1050" class="mono">   before it's paid. …  13. Yes.</text>
  <text x="40" y="1125" class="ts">With G and S most replies were "Yes"; the gain came from the corrections. A rule the agent never raised was never found.</text>
</svg>
