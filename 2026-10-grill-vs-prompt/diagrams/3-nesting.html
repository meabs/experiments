<link rel="stylesheet" href="style.css">
<svg width="1800" height="960" viewBox="0 0 1800 960">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4532a"/></marker>
  </defs>
  <text x="40" y="62" class="th">The nested tickets: the agents rarely found the branch to follow</text>
  <text x="40" y="102" class="ts">A child rule only comes up once the agent knows its parent exists. Counts are of the 15 interviews per ticket (G, S and K, 5 runs each).</text>

  <!-- N1 -->
  <text x="40" y="170" class="tb">N1  Goodwill credits</text>
  <rect x="40" y="195" width="820" height="150" rx="16" class="boxt"/>
  <text x="70" y="245" class="t" font-weight="650">Parent: credits over £100 wait for approval</text>
  <text x="70" y="290" class="ts">Came up in 4 of 15 (G 1, S 3, K 0), each time because the</text>
  <text x="70" y="322" class="ts">agent recommended "no maximum amount" and was corrected</text>
  <path d="M250 345 V 410" class="ln"/><path d="M650 345 V 410" class="ln"/>
  <rect x="40" y="415" width="400" height="140" rx="14" class="box"/>
  <text x="65" y="460" class="t" font-weight="650">How approval works</text>
  <text x="65" y="500" class="ts">Met: G 1, S 2, K 0 of 5</text>
  <rect x="460" y="415" width="400" height="140" rx="14" class="box"/>
  <text x="485" y="460" class="t" font-weight="650">Can't approve your own</text>
  <text x="485" y="500" class="ts">Met: G 1, S 1, K 0 of 5</text>

  <!-- N2 -->
  <text x="940" y="170" class="tb">N2  Approving an account closure</text>
  <rect x="940" y="195" width="820" height="150" rx="16" class="boxr"/>
  <text x="970" y="245" class="t" font-weight="650">Parent: money left in the account must be moved first</text>
  <text x="970" y="290" class="ts">Came up in 0 of 15. No agent asked what happens to</text>
  <text x="970" y="322" class="ts">a balance when the account it sits in is closed</text>
  <path d="M1150 345 V 410" class="lnr"/><path d="M1550 345 V 410" class="lnr"/>
  <rect x="940" y="415" width="400" height="140" rx="14" class="box" opacity="0.55"/>
  <text x="965" y="460" class="t" font-weight="650">Where the money can go</text>
  <text x="965" y="500" class="ts">Never reached</text>
  <rect x="1360" y="415" width="400" height="140" rx="14" class="box" opacity="0.55"/>
  <text x="1385" y="460" class="t" font-weight="650">Booked on both accounts</text>
  <text x="1385" y="500" class="ts">Never reached</text>

  <rect x="40" y="620" width="1720" height="280" rx="16" class="boxn"/>
  <text x="70" y="675" class="tw">What this means</text>
  <text x="70" y="725" fill="#e3eff3" font-size="27">Grilling's one-branch-at-a-time walk should win on nested tickets, but only once the branch is open.</text>
  <text x="70" y="768" fill="#e3eff3" font-size="27">The parent rules came up in 4 of 30 nested interviews, so the walk was hardly tested. Once a parent was</text>
  <text x="70" y="811" fill="#e3eff3" font-size="27">known, both G and S asked about its children. The limit was whether the agent thought to ask at all.</text>
  <text x="70" y="865" fill="#e3eff3" font-size="24">One flat rule was never found either: no run in any arm asked whether savings accounts' daily limits can change.</text>
</svg>
